<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时局图 · 历史互动视觉小说</title>
<style>
/* ============================================================
   《时局图》历史互动视觉小说
   单文件网页版 · 双击即可运行 · 无需联网
   ============================================================ */

:root{
  --paper:      #efe6d4;
  --paper-2:    #e5d9c0;
  --paper-3:    #d9caac;
  --ink:        #221f1b;
  --ink-soft:   #4c453b;
  --ink-faint:  #7d7364;
  --cinnabar:   #9e2b1e;
  --cinnabar-2: #c0392b;
  --gold:       #8a6a3b;
  --seal:       #a8322a;
  --shadow:     rgba(60,45,25,.18);
  --font-serif: "Source Han Serif SC","Noto Serif SC","Songti SC",STSong,"SimSun","宋体",serif;
  --font-kai:   "Kaiti SC",STKaiti,"KaiTi","楷体",var(--font-serif);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-serif);
  color:var(--ink);
  background:#1a1712;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 宣纸底纹 */
.paper-bg{
  position:fixed;inset:0;z-index:0;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 15%, rgba(255,252,242,.85), transparent 55%),
    radial-gradient(ellipse at 82% 88%, rgba(200,180,140,.35), transparent 60%),
    repeating-linear-gradient(0deg, rgba(120,100,70,.030) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,100,70,.022) 0 1px, transparent 1px 4px);
}
.paper-bg::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(70,55,30,.30) 100%);
}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hidden{display:none !important;}

/* ============================ 标题页 ============================ */
#titleScreen{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#161310;
  background-image:
    radial-gradient(ellipse at 50% 42%, rgba(120,90,45,.28), transparent 62%),
    repeating-linear-gradient(0deg, rgba(255,240,200,.014) 0 1px, transparent 1px 3px);
  transition:opacity .7s ease;
}
#titleScreen.fade-out{opacity:0;pointer-events:none;}
.ts-inner{text-align:center;position:relative;padding:0 24px;}
.ts-title{
  font-size:clamp(58px,11vw,116px);
  letter-spacing:.16em;
  color:#e8dcc0;
  text-indent:.16em;
  text-shadow:0 0 42px rgba(200,150,70,.30), 0 3px 0 rgba(0,0,0,.5);
  font-weight:400;
}
.ts-sub{
  margin-top:20px;font-size:clamp(12px,1.5vw,15px);
  letter-spacing:.62em;text-indent:.62em;color:#a8946c;
}
.ts-poem{
  margin:42px auto 0;max-width:520px;
  font-family:var(--font-kai);font-size:16px;line-height:2.3;
  color:#8d7c5c;letter-spacing:.08em;
}
.ts-rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,#6d5a38,transparent);margin:38px auto;}
.ts-menu{display:flex;flex-direction:column;gap:14px;align-items:center;}
.ts-btn{
  min-width:236px;padding:13px 30px;
  border:1px solid #4d4230;color:#cbb894;
  font-size:15px;letter-spacing:.34em;text-indent:.34em;
  background:rgba(255,235,190,.02);
  transition:all .28s ease;
}
.ts-btn:hover:not(:disabled){background:rgba(190,140,60,.14);border-color:#96794a;color:#f0e2c2;letter-spacing:.4em;}
.ts-btn:disabled{opacity:.28;cursor:default;}
.ts-foot{position:absolute;bottom:26px;width:100%;text-align:center;font-size:11.5px;color:#5e5340;letter-spacing:.22em;}

/* ============================ 主舞台 ============================ */
#game{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}

/* 顶栏 */
#topbar{
  flex:0 0 auto;height:52px;
  display:flex;align-items:center;gap:14px;
  padding:0 20px;
  border-bottom:1px solid rgba(120,95,55,.28);
  background:linear-gradient(180deg, rgba(239,230,212,.94), rgba(229,217,192,.80));
  backdrop-filter:blur(3px);
}
.tb-chapter{font-size:14.5px;letter-spacing:.16em;color:var(--ink);white-space:nowrap;}
.tb-chapter b{color:var(--cinnabar);font-weight:400;}
.tb-meta{font-size:12px;color:var(--ink-faint);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-spacer{flex:1;}
.tb-btn{
  font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft);
  padding:6px 12px;border:1px solid rgba(120,95,55,.34);
  background:rgba(255,250,235,.4);
  transition:all .2s;
}
.tb-btn:hover{background:var(--cinnabar);color:#f6ecd8;border-color:var(--cinnabar);}
.tb-btn.on{background:var(--cinnabar);color:#f6ecd8;border-color:var(--cinnabar);
  box-shadow:0 0 0 3px rgba(158,43,30,.14);}

/* 觉醒度 HUD */
#hud{display:flex;gap:18px;align-items:center;margin-right:6px;}
.meter{display:flex;align-items:center;gap:8px;}
.meter-name{font-size:11.5px;color:var(--ink-faint);letter-spacing:.1em;white-space:nowrap;}
.meter-bar{width:76px;height:5px;background:rgba(90,72,42,.18);position:relative;overflow:hidden;}
.meter-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8a6a3b,var(--cinnabar));transition:width .7s cubic-bezier(.2,.8,.3,1);}
.meter-num{font-size:11.5px;color:var(--gold);min-width:20px;font-variant-numeric:tabular-nums;}

/* 正文区 */
#stage{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth;}
#stage::-webkit-scrollbar{width:8px;}
#stage::-webkit-scrollbar-thumb{background:rgba(120,95,55,.28);}

.page{
  max-width:840px;margin:0 auto;
  padding:52px 34px 190px;
  min-height:100%;
}

/* 章节卡 */
.chapter-card{
  text-align:center;padding:64px 0 58px;
  border-bottom:1px solid rgba(120,95,55,.22);
  margin-bottom:44px;
}
.cc-num{font-size:12px;letter-spacing:.6em;text-indent:.6em;color:var(--ink-faint);}
.cc-title{
  font-size:clamp(44px,7vw,74px);letter-spacing:.2em;text-indent:.2em;
  color:var(--ink);margin:16px 0 14px;font-weight:400;
  text-shadow:0 2px 0 rgba(255,250,235,.6);
}
.cc-sub{font-family:var(--font-kai);font-size:15px;color:var(--gold);letter-spacing:.2em;text-indent:.2em;}
.cc-date{margin-top:20px;font-size:12.5px;color:var(--ink-faint);letter-spacing:.2em;}

/* 文本块 */
.beat{margin-bottom:30px;animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.speaker{
  display:inline-block;font-size:13.5px;letter-spacing:.2em;
  color:var(--cinnabar);border-bottom:1px solid rgba(158,43,30,.35);
  padding-bottom:3px;margin-bottom:12px;
}
.speaker .role{color:var(--ink-faint);font-size:11.5px;letter-spacing:.1em;margin-left:8px;}
.line{font-size:18.5px;line-height:2.05;letter-spacing:.045em;color:var(--ink);text-align:justify;}
.line.narration{
  font-family:var(--font-kai);font-size:17.5px;line-height:2.15;
  color:var(--ink-soft);text-indent:2em;
}
.line.emph{color:var(--cinnabar);}
.line.mono{font-family:var(--font-kai);text-indent:0;}

/* 引文 / 史料 */
.quote{
  border-left:3px solid var(--gold);
  background:rgba(255,250,235,.42);
  padding:18px 22px;margin:6px 0;
}
.quote .q-text{font-family:var(--font-kai);font-size:16.5px;line-height:2.1;color:var(--ink-soft);}
.quote .q-src{margin-top:10px;font-size:12.5px;color:var(--ink-faint);letter-spacing:.1em;text-align:right;}

/* 书信 */
.letter{
  border:1px solid rgba(120,95,55,.42);
  background:
    linear-gradient(180deg, rgba(252,246,232,.92), rgba(243,234,214,.92));
  padding:26px 28px;margin:8px 0;
  box-shadow:0 3px 14px rgba(90,70,40,.10);
  position:relative;
}
.letter::before{
  content:"";position:absolute;inset:5px;border:1px solid rgba(120,95,55,.16);pointer-events:none;
}
.letter-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;margin-bottom:16px;
  border-bottom:1px dashed rgba(120,95,55,.34);
}
.letter-to{font-size:14px;letter-spacing:.14em;color:var(--ink);}
.letter-date{font-size:12px;color:var(--ink-faint);letter-spacing:.08em;}
.letter-body{font-family:var(--font-kai);font-size:17px;line-height:2.2;color:var(--ink-soft);white-space:pre-wrap;}
.letter-sig{margin-top:18px;text-align:right;font-family:var(--font-kai);font-size:15px;color:var(--ink-soft);}
.letter-sig .seal{
  display:inline-block;margin-left:10px;
  width:34px;height:34px;line-height:1.05;
  border:1.5px solid var(--seal);color:var(--seal);
  font-size:12px;font-family:var(--font-serif);
  display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:3px;letter-spacing:0;transform:rotate(-3deg);
  text-align:center;
}

/* 选择 */
.choices{margin:34px 0 10px;animation:fadeUp .5s ease both;}
.choice-prompt{
  font-size:13.5px;color:var(--gold);letter-spacing:.2em;
  margin-bottom:16px;display:flex;align-items:center;gap:12px;
}
.choice-prompt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(138,106,59,.4),transparent);}
.choice{
  display:block;width:100%;text-align:left;
  padding:17px 22px;margin-bottom:11px;
  border:1px solid rgba(120,95,55,.34);
  background:rgba(255,250,235,.46);
  font-size:16.5px;line-height:1.7;letter-spacing:.03em;color:var(--ink);
  transition:all .22s ease;position:relative;
}
.choice:hover{
  background:rgba(158,43,30,.075);
  border-color:var(--cinnabar);
  transform:translateX(6px);
  box-shadow:-3px 0 0 var(--cinnabar);
}
.choice .mark{color:var(--cinnabar);margin-right:10px;font-size:13px;}
.choice .hint{display:block;margin-top:7px;font-size:12.5px;color:var(--ink-faint);letter-spacing:.04em;font-family:var(--font-kai);}
/* 未解锁的选项：看得见，点不动 */
.choice.locked{cursor:not-allowed;opacity:.5;border-style:dashed;background:rgba(240,234,220,.35);}
.choice.locked:hover{background:rgba(240,234,220,.35);border-color:rgba(120,95,55,.34);
  transform:none;box-shadow:none;}
.choice.locked .mark{color:var(--ink-faint);}
.choice.locked .hint{color:#9a7f5c;}

/* 存档位 */
.slot-tip{font-size:12.5px;color:var(--ink-faint);letter-spacing:.05em;line-height:1.9;
  margin-bottom:16px;font-family:var(--font-kai);}
.slots{display:flex;flex-direction:column;gap:9px;}
.slot{
  display:flex;align-items:stretch;gap:0;
  border:1px solid rgba(120,95,55,.3);background:rgba(255,250,235,.44);
  transition:all .2s ease;cursor:pointer;position:relative;
}
.slot:hover{background:rgba(158,43,30,.07);border-color:var(--cinnabar);
  box-shadow:-3px 0 0 var(--cinnabar);}
.slot.empty{background:rgba(240,234,220,.3);}
.slot.empty:hover{background:rgba(158,43,30,.05);}
.slot-n{
  flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  font-size:19px;color:var(--gold);letter-spacing:.04em;
  border-right:1px dashed rgba(120,95,55,.28);font-variant-numeric:tabular-nums;
}
.slot-body{flex:1;padding:11px 14px;min-width:0;}
.slot-head{font-size:14.5px;color:var(--ink);letter-spacing:.06em;}
.slot-head.empty-head{color:#a2957f;font-size:13px;letter-spacing:.22em;padding:4px 0;}
.slot-meta{font-size:12px;color:var(--gold);margin-top:5px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;}
.slot-last{font-size:12.5px;color:var(--ink-faint);margin-top:4px;
  font-family:var(--font-kai);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-x{
  flex:0 0 34px;border:none;border-left:1px dashed rgba(120,95,55,.28);
  background:transparent;color:#a2957f;font-size:15px;cursor:pointer;transition:all .2s ease;
}
.slot-x:hover{background:rgba(158,43,30,.12);color:var(--cinnabar);}

/* 结局 */
.ending-final h3{letter-spacing:.22em;}
.ending-body{
  margin-top:6px;padding:20px 22px;
  border:1px solid rgba(120,95,55,.3);background:rgba(255,250,235,.5);
  font-size:15.5px;line-height:2.1;color:var(--ink-soft);
  font-family:var(--font-kai);text-indent:2em;letter-spacing:.02em;
}

/* 底部提示 */
#tapHint{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  height:64px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg, rgba(239,230,212,0), rgba(239,230,212,.95) 55%);
  pointer-events:none;opacity:0;transition:opacity .4s;
}
#tapHint.on{opacity:1;}
#tapHint span{font-size:12.5px;color:var(--ink-faint);letter-spacing:.3em;animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.42;}50%{opacity:.95;}}

/* 觉醒度提示 */
#toast{
  position:fixed;right:26px;bottom:80px;z-index:40;
  display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none;
}
.toast-item{
  background:rgba(34,31,27,.90);color:#f0e2c2;
  padding:9px 17px;font-size:13px;letter-spacing:.14em;
  border-left:3px solid var(--cinnabar);
  animation:toastIn .45s ease both;
}
@keyframes toastIn{from{opacity:0;transform:translateX(22px);}to{opacity:1;transform:none;}}
.toast-item.out{opacity:0;transform:translateX(22px);transition:all .5s;}

/* ============================ 弹层 ============================ */
.overlay{
  position:fixed;inset:0;z-index:70;
  background:rgba(22,19,14,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:26px;
  animation:fadeIn .28s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.panel{
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg, rgba(120,100,70,.026) 0 1px, transparent 1px 3px);
  border:1px solid rgba(120,95,55,.5);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:900px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-bottom:1px solid rgba(120,95,55,.3);
}
.panel-title{font-size:16px;letter-spacing:.28em;color:var(--ink);}
.panel-close{font-size:20px;color:var(--ink-faint);padding:0 6px;line-height:1;}
.panel-close:hover{color:var(--cinnabar);}
.panel-body{padding:24px;overflow-y:auto;flex:1;}
.panel-body::-webkit-scrollbar{width:8px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(120,95,55,.3);}

/* 时局图 */
.map-wrap{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;}
#mapSvg{width:100%;max-width:430px;height:auto;display:block;}
.map-side{flex:1;min-width:250px;}
.map-side h4{font-size:13px;letter-spacing:.24em;color:var(--gold);margin-bottom:14px;font-weight:400;}
.map-legend{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.legend-row{
  display:flex;align-items:center;gap:12px;padding:9px 12px;
  border:1px solid rgba(120,95,55,.22);background:rgba(255,250,235,.36);
  opacity:.34;transition:all .4s;
}
.legend-row.on{opacity:1;background:rgba(158,43,30,.07);border-color:rgba(158,43,30,.4);}
.legend-glyph{
  width:34px;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid currentColor;font-size:17px;
  transform:rotate(-2deg);
}
.legend-txt{font-size:13.5px;line-height:1.55;}
.legend-txt b{font-weight:400;color:var(--ink);letter-spacing:.08em;}
.legend-txt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;margin-top:2px;}
.map-progress{font-size:12.5px;color:var(--ink-faint);letter-spacing:.12em;line-height:1.9;border-top:1px solid rgba(120,95,55,.22);padding-top:14px;}

/* 回想 */
.log-entry{padding:14px 0;border-bottom:1px dashed rgba(120,95,55,.24);}
.log-who{font-size:12.5px;color:var(--cinnabar);letter-spacing:.16em;margin-bottom:6px;}
.log-txt{font-size:15.5px;line-height:1.95;color:var(--ink-soft);font-family:var(--font-kai);}
.log-chapter{font-size:12px;color:var(--gold);letter-spacing:.2em;margin:22px 0 4px;}

/* 史实注 */
.note-item{padding:16px 0;border-bottom:1px dashed rgba(120,95,55,.24);}
.note-item:last-child{border-bottom:none;}
.note-h{font-size:14.5px;color:var(--ink);letter-spacing:.1em;margin-bottom:8px;}
.note-h::before{content:"▍";color:var(--cinnabar);margin-right:8px;font-size:12px;}
.note-b{font-size:14.5px;line-height:1.95;color:var(--ink-soft);font-family:var(--font-kai);}
.note-b .ref{color:var(--ink-faint);font-size:12.5px;}

/* 结局图鉴 */
.ending-card{
  border:1px solid rgba(120,95,55,.3);padding:18px 20px;margin-bottom:14px;
  background:rgba(255,250,235,.36);position:relative;
}
.ending-card.locked{opacity:.42;}
.ending-card h4{font-size:17px;letter-spacing:.18em;font-weight:400;margin-bottom:8px;color:var(--ink);}
.ending-card.locked h4{color:var(--ink-faint);}
.ending-card p{font-size:13.5px;line-height:1.85;color:var(--ink-soft);font-family:var(--font-kai);}
.ending-card .tag{
  position:absolute;right:16px;top:16px;font-size:11px;letter-spacing:.16em;
  color:var(--cinnabar);border:1px solid var(--cinnabar);padding:2px 7px;
}

/* 未完待续 */
.tbc{
  border:1px solid rgba(120,95,55,.36);background:rgba(255,250,235,.4);
  padding:30px 30px 26px;margin:20px 0;
}
.tbc h3{font-size:20px;letter-spacing:.3em;color:var(--cinnabar);font-weight:400;margin-bottom:8px;}
.tbc .tbc-sub{font-size:12.5px;color:var(--ink-faint);letter-spacing:.16em;margin-bottom:22px;}
.tbc-row{display:flex;gap:14px;padding:11px 0;border-top:1px dashed rgba(120,95,55,.24);font-size:14px;}
.tbc-row .k{flex:0 0 108px;color:var(--gold);letter-spacing:.12em;}
.tbc-row .v{flex:1;color:var(--ink-soft);line-height:1.75;font-family:var(--font-kai);}

@media (max-width:720px){
  .tb-meta{display:none;}
  #hud{display:none;}
  .page{padding:34px 18px 170px;}
  .panel-body{padding:16px;}
}
</style>
</head>
<body>

<div class="paper-bg"></div>

<!-- ================= 标题页 ================= -->
<div id="titleScreen">
  <div class="ts-inner">
    <div class="ts-title">时局图</div>
    <div class="ts-sub">历史互动视觉小说</div>
    <div class="ts-poem">
      沉沉酣睡我中华，哪知爱国即爱家！<br>
      国民知醒宜今醒，莫待土分裂似瓜。
    </div>
    <div class="ts-rule"></div>
    <div class="ts-menu">
      <button class="ts-btn" id="btnNew">新 的 一 局</button>
      <button class="ts-btn" id="btnContinue">续 前 一 局</button>
      <button class="ts-btn" id="btnSlots">读 取 存 档</button>
      <button class="ts-btn" id="btnEndings">结 局 图 鉴</button>
      <button class="ts-btn" id="btnAbout">创 作 说 明</button>
    </div>
  </div>
  <div class="ts-foot">1895 — 1899 · 序章 至 第五章 · 五个结局</div>
</div>

<!-- ================= 主界面 ================= -->
<div id="game" class="hidden">
  <div id="topbar">
    <div class="tb-chapter" id="tbChapter"></div>
    <div class="tb-meta" id="tbMeta"></div>
    <div class="tb-spacer"></div>
    <div id="hud">
      <div class="meter">
        <span class="meter-name">沈怀瑾</span>
        <div class="meter-bar"><div class="meter-fill" id="fillShen"></div></div>
        <span class="meter-num" id="numShen">0</span>
      </div>
      <div class="meter">
        <span class="meter-name">林婉如</span>
        <div class="meter-bar"><div class="meter-fill" id="fillLin"></div></div>
        <span class="meter-num" id="numLin">0</span>
      </div>

const NOTES = {
  "序章":[
    { h:"《马关条约》", b:"光绪二十一年三月廿三（1895年4月17日），李鸿章与伊藤博文在日本马关签订《讲和条约》，即《马关条约》。主要内容：中国认朝鲜「独立自主」；割让奉天省南边地方（辽东半岛）、台湾全岛及所有附属各岛屿、澎湖列岛；赔款库平银二万万两；开沙市、重庆、苏州、杭州为通商口岸。后因三国干涉还辽，又追加白银三千万两作为「赎辽费」。<span class='ref'>《马关条约》正文</span>" },
    { h:"赔款的分量", b:"二万万两白银，约相当于清政府三年多的财政收入，折合日元约3.6亿，相当于当时日本四年多的财政收入。这笔赔款直接支撑了日本的金本位制与后续军备扩张。" },
    { h:"公车上书", b:"光绪二十一年四月初八（1895年5月2日），康有为联络十八省举人一千三百余人，联名上书光绪帝，提出拒和、迁都、练兵、变法四项主张，是为「公车上书」。书未递至御前。同年，康有为中进士，授工部主事。" },
    { h:"杨椒山祠", b:"即杨继盛祠，在北京宣武门外达智桥。杨继盛（号椒山）为明嘉靖时兵部员外郎，因弹劾严嵩下狱被杀害。甲午战后，此处为京城士人聚议之所。" },
    { h:"严复与《救亡决论》", b:"严复（1854—1921），字又陵，福建侯官人，天津水师学堂总教习。1895年在天津《直报》上连续发表《论世变之亟》《原强》《辟韩》《救亡决论》等文。《救亡决论》开篇即言：「天下理之最明而势所必至者，如今日中国不变法则必亡是已。」" },
    { h:"关于题记的说明", b:"序章题记引谭嗣同「四万万人齐下泪，天涯何处是神州」两句。此诗作于丙申（1896年），晚于序章所写时间。此处系以题记定调，非剧中人物当时所读，特此说明。" }
  ],
  "第一章":[
    { h:"三国干涉还辽", b:"1895年4月23日，俄国联合德国、法国向日本发出照会，要求日本放弃占有辽东半岛。日本无力对抗三国，于5月5日声明接受，11月8日交还辽东，同时向清政府索取白银三千万两「赎辽费」。俄国随即以「还辽有功」为由索取报酬。" },
    { h:"《中俄密约》", b:"光绪二十二年四月（1896年6月3日），李鸿章在莫斯科与俄国签订《御敌互相援助条约》，通称《中俄密约》。俄方获得在黑龙江、吉林地方修筑铁路直达海参崴的权利，即东清铁路（中东铁路），并可沿铁路设护路军、开矿、经商。条约长期秘而不宣，经西文报纸披露后始为国人知晓。" },
    { h:"西伯利亚铁路与不冻港", b:"俄国于1891年动工修筑西伯利亚大铁路。其远东缺少常年不冻的出海港口：海参崴每年封冻约三个月，波罗的海与黑海出口亦受制于人。寻找不冻港是俄国远东政策的长期动力，旅顺、大连因此成为其觊觎目标。" },
    { h:"严复的思想", b:"严复在《原强》中提出：「是以今日要政，统于三端：一曰鼓民力，二曰开民智，三曰新民德。」他所译《天演论》以「物竞天择，适者生存」立论，其译文云：「物竞者，物争自存也；天择者，存其宜种也。」《天演论》于1897年译成，1898年正式刊行。" },
    { h:"关于《国闻报》的史实说明", b:"《国闻报》由严复等人创办于光绪二十三年十月（1897年10月），馆设天津。本作第一章时间跨度为1895至1896年，其时该报尚未问世，故剧中沈怀瑾所投之报为天津《直报》，严复在剧中「打算自己办一份报」一语，即为此事伏笔。" },
    { h:"虚构人物声明", b:"沈怀瑾、沈鹤龄、林婉如、黎景高、黎景明、周子安、陈道台等为虚构人物；严复、康有为、张謇、谭嗣同、丘逢甲、刘永福等为历史人物。虚构人物的经历与对话系创作性重构，用以串联宏大历史与个体体验，不代表史实记载。" }
  ],
  "第二章":[
    { h:"德国强占胶州湾", b:"光绪二十三年十月初七（1897年11月1日），山东巨野县发生教案，两名德国圣言会传教士能方济、韩理被杀，是为「巨野教案」。德国以此为借口，于十月二十日（11月14日）派远东舰队司令棣德利率舰强占胶州湾。光绪二十四年二月十四日（1898年3月6日），中德签订《胶澳租界条约》，德国租借胶州湾九十九年，并取得在山东修筑铁路、开采矿产的权利。德国由此成为列强在中国强占租借地的始作俑者。" },
    { h:"列强租借狂潮", b:"德国强占胶州湾后，列强竞相效尤，形成瓜分中国的狂潮。光绪二十四年三月，俄国租借旅顺、大连（《旅大租地条约》）；同月，法国租借广州湾，并将云南、广西、广东划入势力范围；四月，日本迫使清政府声明福建一省不得割让或租借给他国；同月，英国租借威海卫，并签订《展拓香港界址专条》，租借九龙半岛新界九十九年。自1897年11月德国占胶州湾至1898年5月，前后不过半年。" },
    { h:"大生纱厂的筹办", b:"光绪二十一年（1895年），张謇在南通开始筹办大生纱厂。原定商办，因集股困难，1896年改为官商合办，由江宁商务局拨官机折价入股。筹办历时四年，张謇在上海、南通、海门等地奔走募股，屡遭钱庄拒绝，其自述为「千磨百折」。大生纱厂于光绪二十五年四月（1899年5月23日）正式开车纺纱。本剧第二章时间设定在1897至1898年，其时纱厂尚在筹办阶段，剧中张謇「明年可望开车」一语即指此事。" },
    { h:"张謇与《厂约》", b:"张謇（1853—1926），字季直，江苏南通人。光绪二十年（1894年）中甲午恩科状元，授翰林院修撰。同年因父丧丁忧回籍。《马关条约》签订后，决心弃官从事实业。其在日记中写道：「几馨中国之膏血，国体之得失无论矣。」<br><span class='ref'>剧中张謇所述「沥血肥虎」之义，见其《厂约》：「通州之设纱厂，为通州民生计，亦即为中国利源计。……捐我之产以资人，人即用资于我之货售我，无异沥血肥虎，而袒裼以继之，利之不保，我民日贫，国于何赖？」按《厂约》成文于1899年大生纱厂开车之时，晚于本剧第二章时间。剧中系以张謇一贯主张的口述形式呈现，特此说明。</span>" },
    { h:"中国生丝与日本竞争", b:"生丝是中国近代最大宗的出口商品。19世纪后期，日本在政府扶持下引进法国式缫丝机械，推行机器缫丝，生丝条份均匀、断头少，售价高于中国手工缫丝。日本生丝出口量自1880年代起迅速增长，至1909年超过中国，跃居世界第一。剧中林婉如所查阅的出口数据，反映的正是这一竞争态势。" },
    { h:"买办", b:"买办（comprador）是外国洋行在中国雇佣的华籍代理人，负责与华商交易、处理银钱往来、招揽生意，并从中抽取佣金。买办依附于外国资本，但又是中国最早接触近代商业、金融、航运体系的群体之一。其身份在近代史上长期存在争议。" },
    { h:"《时务报》", b:"《时务报》于光绪二十二年七月（1896年8月）在上海创刊，汪康年任经理，梁启超任主笔。梁启超在该报连载《变法通议》，风靡全国，发行量逾万份，为维新运动时期影响最大的报刊。剧中林婉如赴福州路报馆一节，报馆管事「周先生」为虚构人物。" },
    { h:"虚构人物声明（第二章）", b:"林伯渊（林婉如之父，买办）、林仲甫（林婉如之叔，掌林家钱庄）、克纳普（德商）、贝牧师（英籍传教士）、周先生（《时务报》馆管事）、通州来客等均为虚构人物。张謇为历史人物。剧中张謇的言论系依据其日记、《厂约》及相关文献重构，非原始记载。" }
  ],
  "第三章":[
    { h:"《时局图》与谢缵泰", b:"谢缵泰（1872—1937），字重安，号康如，广东开平人，生于澳大利亚悉尼，长于香港，为兴中会会员、辅仁文社发起人之一。光绪二十四年（1898年），他在香港绘制《东亚时局形势图》，彩色石印，将列强在华势力以动物形象绘于中国版图之上：熊代表俄国，虎代表英国，蛙代表法国，鹰代表美国，日代表日本，犬代表德国（原图德国亦有作「肠」者，以德式香肠为喻；本作从通行本作「犬」）。图旁题四言诗一首。1903年上海《俄事警闻》刊载修改本，流传益广。剧中沈怀瑾与林婉如所见，即1898年在香港印行的初版。" },
    { h:"图中所绘的「睡着的官员」", b:"《时局图》除列强动物之外，另绘有数名清廷人物形象：有手持铜钱者，有横卧吸食鸦片者，有手举「科举」牌匾者，用以讽刺朝野上下醉生梦死、不知危亡。本剧第三章中沈怀瑾所见，即依原图这一构图。" },
    { h:"法国租借广州湾", b:"光绪二十四年三月（1898年4月），法国公使吕班向总理衙门提出四项要求：一、中国不得将云南、广西、广东让与他国；二、允许法国自越南修筑铁路至云南省城；三、将广州湾租与法国；四、聘用法国人襄办邮政。同年闰三月（4月22日），法国兵舰驶入广州湾海头汛，登陆占据炮台。光绪二十五年十月（1899年11月16日），中法签订《广州湾租界条约》，租期九十九年。广州湾即今广东省湛江市。" },
    { h:"广州与广州湾并非一地", b:"原大纲写「林婉如在广州目睹法国租借广州湾的过程」。按广州（Canton）为广东省城，广州湾（Kwangchouwan）在雷州半岛，即今湛江，两地相距约四百里，并非同一处。剧中据此改为：林婉如因恒昌洋行生丝纠纷赴广州，在白鹅潭目睹法国兵舰陈兵施压，广州湾的情形则由报载及一位遂溪商人之口传入；玩家若选择「去遂溪」，林婉如则亲赴广州湾一带。特此说明。" },
    { h:"遂溪、吴川民众抗法", b:"光绪二十四年至二十五年（1898—1899），法军为划定广州湾租界，派员深入遂溪、吴川等地丈量土地、插立界桩，遭到当地乡民抵制，各乡自组民团武装抵抗。遂溪知县李钟珏同情民众，为民团提供粮饷、火药。光绪二十五年十月（1899年11月），法军进攻遂溪黄略村，村民死伤惨重。由于民众抵抗，法国实际划定的租界范围较其最初要求有所缩小。剧中梁先生所述「拔木桩」「各乡凑民团」「李大人给粮给火药」，均本此。" },
    { h:"英国租借威海卫与新界", b:"光绪二十四年四月（1898年6月9日），中英签订《展拓香港界址专条》，英国租借九龙半岛及其附近二百余岛屿，为期九十九年，是为「新界」。同年五月（7月1日），中英签订《订租威海卫专条》，英国租借威海卫，租期与俄国租借旅顺之期相同。1899年，新界乡民曾武装抵抗英军接管，史称「新界六日战」。" },
    { h:"日本与福建", b:"光绪二十四年闰三月（1898年4月），日本照会清政府，要求声明福建省及其沿海一带不得割让或租借给他国。清政府于同月复照应允，福建遂被划入日本势力范围。" },
    { h:"台湾乙未抗日与「永清」年号", b:"光绪二十一年（1895年）《马关条约》签订后，台湾士绅于五月成立「台湾民主国」，推唐景崧为总统，建元「永清」，寓「永远归大清」之意。同年五月，日军在澳底登陆，六月攻陷基隆、台北，唐景崧内渡；刘永福率黑旗军守台南，丘逢甲等组织义军抵抗。十月，日军攻陷台南，刘永福内渡，台湾民主国覆亡，「永清」年号前后使用约五个月。此后台湾各地武装抗日持续不断，至1902年林少猫被杀始大体平息。剧中梁先生所述「义军还在山里」「年号用了五个月」，即指此。" },
    { h:"美国「门户开放」照会", b:"光绪二十五年八月（1899年9月），美国国务卿海约翰分别向英、俄、德、法、日、意六国发出照会，提出「门户开放」政策，要求各国在其在华势力范围内，对各国商务与航运一视同仁。按此照会晚于本剧第三章所写的1898年。谢缵泰绘《时局图》时以鹰代表美国，反映的是美国在华商业势力及其对华政策的姿态，故剧中于第三章一并揭示鹰之形象，特此说明。" },
    { h:"剧中引文说明", b:"《时局图》题诗「沉沉酣睡我中华，哪知爱国即爱家！国民知醒宜今醒，莫待土分裂似瓜。」系谢缵泰所作，见于该图及当时报刊转载。剧中第三章所引法国致总理衙门四项要求，系据当时报载整理，非条约原文。沈怀瑾、林婉如所述「欲开民智，必自蒙学始」「知道了，就拔他的桩子」等语为虚构人物的言论，非史料记载。" },
    { h:"虚构人物声明（第三章）", b:"沈怀瑾、沈鹤龄、林婉如、林伯渊、黎景高、黎景明、周先生、何伯、王山长、黄教谕、梁先生（遂溪药材商）、王乡绅（遂溪民团）、石印铺掌柜、卖凉茶的老人等均为虚构人物。谢缵泰为历史人物，李钟珏为历史人物（遂溪知县）。剧中历史人物的言行系依据相关文献重构，非原始记载。" }
  ],
  "第四章":[
    { h:"台湾民主国", b:"光绪二十一年（1895年）《马关条约》签订后，台湾士绅反对割让，于五月二十三日发表《台湾民主国自主宣言》，五月二十五日（农历五月初二）在台北成立「台湾民主国」，推唐景崧为总统，建元「永清」，国旗为蓝地黄虎旗，虎首内向，以示心向中国。五月二十九日，日军在澳底登陆；六月三日狮球岭失守，基隆陷落；六月四日唐景崧弃台北走淡水，六月六日搭德国轮船内渡厦门；六月七日日军入台北，六月十七日桦山资纪在台北举行始政式。十月十九日刘永福内渡厦门，十月二十一日日军入台南，台湾民主国覆亡。自五月二十五日至十月二十一日，前后共一百四十九天。剧中黎景高信中所言「一百四十九天」本此。" },

    { h:"云林大屠杀", b:"光绪二十二年（1896年）六月，云林斗六一带民众武装抗日，袭击日军派出所与守备队。日军调兵镇压并实行报复性屠杀，斗六、大埤等地平民死伤惨重。关于死亡人数，日方记载为万余人，台湾方面记载为数万人，说法不一，至今仍有争议。剧中未给出具体数字，仅以黎景高亲历者的口吻记述「见人就杀」「村子没了」，以免在争议数字上作出断言。" },
    { h:"台湾居民的国籍选择", b:"《马关条约》第五款规定：台湾居民限两年之内，可任意变卖产业迁出；两年期满之后仍未迁出者，即视为日本臣民。期限截止于光绪二十三年五月初八，即公元1897年5月8日。当日前后，台湾各地民众排队登记离台。据日方统计，登记迁出者约六千四百余人，而未及登记或无力迁出者更多。剧中黎景高「排在队里，排到一半，出来了」一节，即写这一期限。他改籍后所用年号、文字，均为剧中虚构人物的自述，非史料记载。" },

    { h:"戊戌变法与谭嗣同", b:"剧中第四章开头所述「八月，皇上下了几十道诏书」「九月二十一，太后从颐和园回宫，训政」「九月二十八，菜市口」，指光绪二十四年（1898年）的戊戌变法及其失败。六月十一日光绪帝颁《明定国是》诏，其后推行新政；九月二十一日慈禧太后发动政变，宣布训政；九月二十八日谭嗣同、林旭、杨深秀、杨锐、刘光第、康广仁六人在北京菜市口就义，史称「戊戌六君子」。谭嗣同（1865—1898），湖南浏阳人，故剧中沈怀瑾念及「浏阳离湘乡三百里」。" },
    { h:"剧中引文说明", b:"黎景高的十四封信、黎景明的附信，以及丘逢甲「吾台人自问，何负于朝廷」一语，均系据乙未抗日相关史料与回忆而重构，非原始文献。剧中沈怀瑾、林婉如、黎景高等人的言论为虚构创作。第五章尚未展开的戊戌变法内容，将于该章史实注中另行列明。" },
    { h:"虚构人物声明（第四章）", b:"黎景高（台湾台南府官员）、黎景明（台湾嘉义举人）、沈怀瑾、沈鹤龄、王山长、连横（剧中仅作为时代坐标提及）等人物中，黎景高、黎景明、沈怀瑾、沈鹤龄、王山长为虚构人物；吴汤兴、徐骧、姜绍祖、唐景崧、丘逢甲、刘永福、桦山资纪、谭嗣同、连横为历史人物。剧中历史人物的言行系依据相关文献重构，非原始记载。连横在剧中未被赋予虚构言行，仅引用其日后著作序文。" }

  "第五章":[

    { h:"唐才常与自立军", b:"唐才常（1867—1900），字佛尘，湖南浏阳人，与谭嗣同同乡、同学，曾任时务学堂教习。戊戌政变后流亡日本，回国后在上海组织正气会、自立会，联络长江流域会党，筹组自立军，以「勤王」为号召。原定光绪二十六年七月十五日（1900年8月9日）起兵，因康有为海外汇款未到而延期；七月二十七日（8月21日）事泄，唐才常被捕，次日就义于武昌。剧中唐才常「我算出来五年」的自述、以及沈怀瑾事败后继续活动至光绪二十九年被捕，均为虚构创作；自立军起事的日期与结局为史实。" },
    { h:"义和团与八国联军", b:"光绪二十六年（1900年），义和团运动蔓延至北京，八国联军攻入北京，慈禧太后携光绪帝西逃西安。剧中结局一「义和团进了北京，八国联军进了北京」一段本此。此年为庚子年，史称庚子国变。" },
    { h:"中国同盟会与辛亥革命", b:"光绪三十一年（1905年）七月，中国同盟会在东京成立，誓词为「驱除鞑虏，恢复中华，创立民国，平均地权」。宣统三年八月十九日（1911年10月10日）武昌新军起事，占领楚望台军械库，各省相继响应，史称辛亥革命。剧中沈怀瑾「宣统三年」在东京听讲演、在上海码头看到「武昌起事」四字号外，本此。剧中以「武昌起事」而非「民国」作为号外标题，是因为中华民国成立于1912年1月1日，晚于剧中场景。" },
    { h:"一九四五年台湾光复", b:"结局四「永清」的尾声写至一九四五年八月。是年日本投降，台湾结束自1895年《马关条约》起长达五十年的日本统治。剧中沈怀瑾在台南听到广播、说「日本人走了」一节，为虚构人物的虚构情节；台湾光复为史实。剧中的沈怀瑾生于1874年前后（序章 1895 年时二十二岁），至1945年为七十一岁，剧中年龄据此推算。" },

      {t:"d", w:"沈怀瑾", x:"三年不吃不喝，不修河，不养兵，不赈灾，一文不花，才还得清。"},

      {t:"d", w:"何伯", x:"少东家，那是大人们的事。"},

        body:"怀瑾仁弟足下：\n\n来书具悉。足下年二十二，居湘乡，而言及西伯利亚铁路与不冻港之求，此非乡里少年所能道，仆甚异之。\n\n来书问：俄人何以助我？\n\n仆答曰：俄人非助我，俄人自助耳。国与国相接，无恩义可言，惟有强弱。强者取之，弱者与之。此天演之公例，非一二人之善恶也。今日之俄，犹昔日之英、法；今日之英、法，犹昔日之俄。易地则皆然。\n\n仆近年读西人书，见其论生物之繁变，有所谓「物竞天择」之说。物竞者，物争自存也；天择者，存其宜种也。推之国之相竞，亦复如是。\n\n足下问自何处变起。仆以为，统于三端：一曰鼓民力，二曰开民智，三曰新民德。三者不立，则船炮虽利，终为他人守耳。\n\n北洋水师之覆，非船不利，非炮不猛。是操船放炮之人，与夫号令操船放炮之人，犹是三十年前之人也。\n\n足下有志，可多读西书，先通其语言文字，而后能知其政教之本。勿徒以气盛为学问。\n\n仆近有所见，辄投之天津《直报》。足下若有作，亦可投之，仆当为之道地。\n\n严复 顿首",
        sig:"严复", seal:"又陵"},
      {t:"n", x:"沈怀瑾把这封信读了三遍。"},
      {t:"n", x:"第一遍，他读的是「俄人非助我，俄人自助耳」。"},
      {t:"n", x:"第二遍，他读的是「物竞天择，适者生存」。"},
      {t:"n", x:"第三遍，他读的是那一句——"},
      {t:"q", x:"北洋水师之覆，非船不利，非炮不猛。是操船放炮之人，与夫号令操船放炮之人，犹是三十年前之人也。", src:"严复来信"},
      {t:"n", x:"他忽然明白了一件事。"},
      {t:"n", x:"洋务三十年，买的是船，是炮，是机器。"},
      {t:"n", x:"可是用这些东西的人，还是原来的人。"},
      {t:"n", x:"把最利的刀交到不会用的人手里，刀越好，伤得越重。", emph:true}
    ],

  },

  "c2_3":{

      {t:"d", w:"林伯渊", x:"我不是替洋人做事。"},
      {t:"d", w:"林伯渊", x:"我是替林家做事。"},
      {t:"d", w:"林伯渊", x:"洋人来了，我给他们做事。洋人走了，我给他们做事的人也做事。"},
      {t:"d", w:"林伯渊", x:"林家要活下去。"},
      {t:"d", w:"林婉如", x:"那中国呢？"},
      {t:"n", x:"林伯渊看着她。"},
      {t:"n", x:"他没有回答这个问题。"},
      {t:"n", x:"他只是把那张收据推了回去，推到他女儿面前。"},
      {t:"d", w:"林伯渊", x:"收好。"},
      {t:"d", w:"林伯渊", x:"别让你叔父看见。"}
    ],
    next:"c2_after"
  },

  "c2_qingbao":{
    ch:"第二章", chTitle:"虎", place:"上海 · 恒昌洋行 · 二楼电报房外", date:"光绪二十四年 正月",
    beats:[
      {t:"n", x:"林婉如没有把钱拿出来。"},
      {t:"n", x:"她做的是另一件事。"},
      {t:"n", x:"——"},
      {t:"n", x:"洋行的电报房在二楼最里头。所有的进出口电报，都要从那里过。"},
      {t:"n", x:"林婉如的桌子，离电报房三步远。"},
      {t:"n", x:"电报员译电的时候，门是开着的。这是洋行的规矩——洋经理要看得住。"},
      {t:"n", x:"林婉如每天要往电报房送三次提单，取两次回单。"},
      {t:"n", x:"她从来不往里面多看一眼。"},
      {t:"n", x:"她只是在门口停一下。"},
      {t:"n", x:"停一下，够看半张纸。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"那年冬天，她记下了十七封电报。"},
      {t:"n", x:"有的是船期，有的是丝价，有的是货损的理赔。"},
      {t:"n", x:"有一封是从柏林来的。"},
      {t:"n", x:"电报里说：胶州湾的煤，够远东舰队烧二十年。"},
      {t:"n", x:"还有一封是从伦敦来的。"},
      {t:"n", x:"电报里说：如果俄国要旅顺，我们就得要威海卫。"},
      {t:"n", x:"——"},
      {t:"n", x:"林婉如记到这一句的时候，手停了很久。"},
      {t:"n", x:"原来这些地方，是在别人的电报里，被这样分掉的。", emph:true},
      {t:"n", x:"旅顺。威海卫。名字写得像货单上的一行字。"},
      {t:"n", x:"——"},
      {t:"n", x:"开春以后，她去了福州路。"},
      {t:"n", x:"《时务报》的馆址在那条街上，一间不大的门面，门口挂着木牌。"},
      {t:"n", x:"这份报纸是前年办的。主笔姓梁，广东人，二十四岁。"},
      {t:"n", x:"他的文章写得让全国的读书人都在传抄。"},
      {t:"n", x:"林婉如没有见到梁主笔。"},
      {t:"n", x:"她见的是报馆里一位管事的先生，姓周，四十来岁，戴眼镜，说话很慢。"},
      {t:"d", w:"周先生", r:"《时务报》馆", x:"姑娘，这些……你是从哪里来的？"},
      {t:"d", w:"林婉如", x:"恕我不能说。"},
      {t:"d", w:"周先生", x:"这些东西，登出来是要出事的。"},
      {t:"d", w:"林婉如", x:"那就不要登。"},
      {t:"d", w:"林婉如", x:"只要让该知道的人知道。"},
      {t:"n", x:"周先生看了她很久。"},
      {t:"n", x:"然后他把那几张纸收起来，放进抽屉，锁上。"},
      {t:"d", w:"周先生", x:"姑娘，我记你一句话。"},
      {t:"d", w:"周先生", x:"你这样做事，是很危险的。"},
      {t:"d", w:"林婉如", x:"我知道。"},
      {t:"d", w:"周先生", x:"那你为什么还要做？"},
      {t:"n", x:"林婉如想了想。"},
      {t:"d", w:"林婉如", x:"因为我每天坐在那间屋子里。"},
      {t:"d", w:"林婉如", x:"那些电报从我的桌子上过。"},
      {t:"d", w:"林婉如", x:"如果我装作没看见——"},
      {t:"d", w:"林婉如", x:"那我跟那间屋子里的一张桌子，有什么区别。"},
      {t:"n", x:"——"},
      {t:"n", x:"那年三月，恒昌洋行换了一位电报员。"},
      {t:"n", x:"新来的电报员很仔细。他开始记录每一封电报是谁经手的。"},
      {t:"n", x:"林婉如察觉到了。"},
      {t:"n", x:"她没有再记。"},
      {t:"n", x:"十七封电报，到此为止。"},
      {t:"n", x:"但是她记住了那间屋子的位置，和那些纸的样子。"},
      {t:"n", x:"她还记住了一件事："},
      {t:"n", x:"原来在这个城市里，有一些人，是在等着看这些纸的。", emph:true}
    ],
    next:"c2_after"
  },

  "c2_youyu":{
    ch:"第二章", chTitle:"虎", place:"上海 · 英租界 · 江西路教堂", date:"光绪二十四年 正月",
    beats:[
      {t:"n", x:"林婉如什么也没有做。"},
      {t:"n", x:"她把那张表折起来，放进抽屉最底下。"},
      {t:"n", x:"那匹纱样，也放进了同一个抽屉。"},
      {t:"n", x:"——"},
      {t:"n", x:"正月里，她一个人去了一趟江西路。"},
      {t:"n", x:"那条街上有一座教堂，是英国人盖的。她小时候跟母亲来过几次。"},
      {t:"n", x:"里面很空。冬日的太阳从彩色玻璃照进来，落在地上是一块一块的颜色。"},
      {t:"n", x:"贝牧师在。英国人，来中国二十年了，头发全白。"},
      {t:"n", x:"他认得她。"},
      {t:"d", w:"贝牧师", r:"英籍传教士", x:"林小姐，你很久没来了。"},
      {t:"d", w:"林婉如", x:"是。"},
      {t:"d", w:"贝牧师", x:"你母亲在的时候，常来。"},
      {t:"d", w:"贝牧师", x:"她跟我说过一句话，我记到现在。"},
      {t:"d", w:"贝牧师", x:"她说：牧师，你们洋人的东西好，可是你们的国家欺负我们。"},
      {t:"d", w:"贝牧师", x:"我那时候答不上来。"},
      {t:"n", x:"——"},
      {t:"n", x:"他们在长椅上坐了一会儿。"},
      {t:"d", w:"贝牧师", x:"你们中国的事，我看了二十年。"},
      {t:"d", w:"贝牧师", x:"我给你们办过学堂，办过医院，译过书。"},
      {t:"d", w:"贝牧师", x:"我是真心希望中国好的。"},
      {t:"d", w:"林婉如", x:"那胶州湾呢？"},
      {t:"n", x:"贝牧师放下手里的茶杯。"},
      {t:"d", w:"贝牧师", x:"那是政府的军队做的事。我是传教士。"},
      {t:"d", w:"林婉如", x:"可是德国占了胶州湾，德国商人在山东的生意就更好做。"},
      {t:"d", w:"林婉如", x:"而您，是坐着英国商人的船来中国的。"},
      {t:"d", w:"林婉如", x:"您住的房子，在英租界。"},
      {t:"n", x:"贝牧师沉默了一下。"},
      {t:"n", x:"然后他说了一句很坦白的话。"},
      {t:"d", w:"贝牧师", x:"林小姐，我告诉你一件我自己也不愿意想的事。"},
      {t:"d", w:"贝牧师", x:"你们的官员，只知道签条约。"},
      {t:"d", w:"贝牧师", x:"我们的商人，不过是趁着这个机会做买卖。"},
      {t:"d", w:"贝牧师", x:"这不是我们坏。"},
      {t:"d", w:"贝牧师", x:"这是你们的门没有关。"},
      {t:"n", x:"——"},
      {t:"n", x:"林婉如没有再说话。"},
      {t:"n", x:"她走出教堂的时候，外面在下雨。"},
      {t:"n", x:"她在雨里站了一会儿。"},
      {t:"n", x:"她想起贝牧师说的那句话——「这是你们的门没有关。」"},
      {t:"n", x:"她想起父亲说过的一句话——「林家要活下去。」"},
      {t:"n", x:"她想起抽屉里那匹纱样。"},
      {t:"n", x:"她想起张謇。她从来没有见过他，只听人说过他的名字。"},
      {t:"n", x:"——"},
      {t:"n", x:"那天晚上，她把抽屉里的东西又拿出来看了一遍。"},
      {t:"n", x:"看完，她没有放回抽屉。"},
      {t:"n", x:"她把它放在了枕头底下。"},
      {t:"n", x:"这是一个人还在犹豫的时候，能做的最后一件事。", emph:true}
    ],
    next:"c2_after"
  },

  "c2_after":{
    ch:"第二章", chTitle:"虎", place:"上海 · 外滩", date:"光绪二十四年 三月 — 五月",
    beats:[
      {t:"n", x:"光绪二十四年，春天。"},
      {t:"n", x:"上海的外滩上，报童的嗓子一天比一天哑。"},
      {t:"n", x:"三月，俄国租了旅顺和大连。"},
      {t:"n", x:"四月，法国租了广州湾，又把云南、广西、广东划进了自己的范围。"},
      {t:"n", x:"同一个月，日本逼着总理衙门发了一道声明：福建一省，不得割让或租借给别国。"},
      {t:"n", x:"——"},
      {t:"n", x:"林婉如把这些消息，一条一条剪下来，贴在一个本子上。"},
      {t:"n", x:"她剪报的时候很安静。剪下来的纸条，边缘剪得很齐。"},
      {t:"n", x:"——"},
      {t:"n", x:"五月里，又来了一条。"},
      {t:"q", x:"英国租借威海卫。\n英国展拓香港界址，租借九龙半岛新界，租期九十九年。",
        src:"光绪二十四年 三月至四月，中英所订各约"},
      {t:"n", x:"林婉如把这条贴上去的时候，忽然停住了。"},
      {t:"n", x:"她把本子翻回前面，从头看起。"},
      {t:"n", x:"俄国，德国，法国，日本，英国。"},
      {t:"n", x:"五个国家。五块地方。"},
      {t:"n", x:"从去年十一月德国占胶州湾，到现在，是半年。"},
      {t:"n", x:"半年。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"有一天，林伯渊从洋行回来，脸色不好。"},
      {t:"d", w:"林伯渊", x:"洋人要在上海办纱厂了。"},
      {t:"d", w:"林婉如", x:"哪个洋人？"},
      {t:"d", w:"林伯渊", x:"英国的。还有日本的。"},
      {t:"d", w:"林伯渊", x:"他们不用租界，不用兵舰。他们只要开厂。"},
      {t:"d", w:"林伯渊", x:"厂开在中国，用的是中国的棉花，中国的工钱，织出来的布卖给中国人。"},
      {t:"d", w:"林伯渊", x:"钱，运回英国去。"},
      {t:"n", x:"——"},
      {t:"n", x:"林婉如忽然明白了什么。"},
      {t:"n", x:"俄国人占旅顺，那是看得见的。有兵舰，有旗子，有条约。"},
      {t:"n", x:"德国人占胶州湾，也是看得见的。"},
      {t:"n", x:"可是英国人不一样。"},
      {t:"n", x:"英国人不用占你的地。"},
      {t:"n", x:"英国人只要你的钱。", emph:true},
      {t:"n", x:"占地的人，你还知道该恨他。"},
      {t:"n", x:"要钱的人，你天天跟他打交道，还管他叫「大班」，见了他要脱帽。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"她想起克纳普说过的话。"},
      {t:"d", w:"克纳普", x:"你们连山东都守不住。那不是我们的错，是不是？"},
      {t:"n", x:"那天她答不上来。"},
      {t:"n", x:"今天她想，如果克纳普再问一遍，她还是答不上来。"},
      {t:"n", x:"但是她想明白了一件事——"},
      {t:"n", x:"老虎吃人，不用张牙。", emph:true}
    ],
    next:"c2_end"
  },

  "c2_end":{
    ch:"第二章", chTitle:"虎", place:"上海 · 虹口 · 林家", date:"光绪二十四年 五月",
    beats:[
      {t:"n", x:"五月末，林婉如收到一封信。"},
      {t:"n", x:"信封上的字是端楷，一笔不苟。"},
      {t:"n", x:"两个月前，她给南通写过一封信。"},
      {t:"n", x:"信很短。她只问了一件事：纱厂什么时候能开车。"},
      {t:"n", x:"落款只写了「上海 林氏」。"},
      {t:"n", x:"她没想到会收到回信。"},
      {t:"letter", title:"南通来信", to:"林婉如女士", date:"光绪二十四年 五月 于南通",
        body:"林婉如女士鉴：\n\n惠书敬悉。\n\n厂事艰难，一言难尽。官机已拨，而商股仍未足额。沪上钱庄十九闭门，闻「厂」字则色变。\n\n然厂房已立，机器已装。若无意外，明年可望开车。\n\n女士前问：有没有一种买卖，是中国人自己从头做到尾的。\n\n仆今日仍不能答「有」。然仆可以答一句：快了。\n\n中国之事，非三年五年之事，亦非一代人之事。仆今年四十五，若能亲眼看见大生的纱上市，已是万幸。\n\n愿女士勿急。\n\n张謇 顿首",
        sig:"张謇", seal:"季直"},
      {t:"n", x:"她把这封信读了两遍。"},
      {t:"n", cond:function(s){return !!s.flags.lin_shiye;}, x:"信封里还夹着一张纸。"},
      {t:"n", cond:function(s){return !!s.flags.lin_shiye;}, x:"是股单。三千两，一千五百股。上面盖着通州大生纱厂的印。"},
      {t:"n", cond:function(s){return !!s.flags.lin_shiye;}, x:"林婉如把股单夹进账本里。"},
      {t:"n", cond:function(s){return !!s.flags.lin_shiye;}, x:"那是她这辈子第一张，属于中国人自己产业的凭据。", emph:true},
      {t:"n", cond:function(s){return !!s.flags.lin_qingbao;}, x:"林婉如把信读完了，正要折起来，忽然看见信末还有一行小字。"},
      {t:"d", cond:function(s){return !!s.flags.lin_qingbao;}, w:"张謇（信末）", x:"又及：沪上友人言，有洋行华籍职员抄录外洋电报，供维新人士参考，其人姓名不详。"},
      {t:"d", cond:function(s){return !!s.flags.lin_qingbao;}, w:"张謇（信末）", x:"此等事，可为而不可久为。中国缺人，缺的是能做事几十年的人，不是能拼命一时的人。"},
      {t:"n", cond:function(s){return !!s.flags.lin_qingbao;}, x:"林婉如看完，把信折好，放进抽屉。"},
      {t:"n", cond:function(s){return !!s.flags.lin_qingbao;}, x:"她没有再抄电报。"},
      {t:"n", cond:function(s){return !!s.flags.lin_qingbao;}, x:"但是那句话，她记住了。", emph:true},
      {t:"n", cond:function(s){return !!s.flags.lin_youyu;}, x:"林婉如把信读完了。"},
      {t:"n", cond:function(s){return !!s.flags.lin_youyu;}, x:"然后她走到床边，掀开枕头，把底下那匹纱样拿了出来。"},
      {t:"n", cond:function(s){return !!s.flags.lin_youyu;}, x:"纱是白的，很细，捻得很紧。"},
      {t:"n", cond:function(s){return !!s.flags.lin_youyu;}, x:"她用手捻了捻。"},
      {t:"n", cond:function(s){return !!s.flags.lin_youyu;}, x:"这一次，她把它放在了枕头上面。", emph:true},
      {t:"map", reveal:["de","uk"], text:"犬自山东来，虎自长江来。一个要地，一个要钱。"},
      {t:"n", x:"——"},
      {t:"n", x:"这一年，林婉如二十岁。"},
      {t:"n", x:"她会的英语和法语，她记的账，她认得的那些洋人——"},
      {t:"n", x:"从前她以为，这些是自己比别人强的凭据。"},
      {t:"n", x:"现在她知道了：它们只是让她比别人更早看见。"},
      {t:"n", x:"看见，不等于能改变。"},
      {t:"n", x:"但是看不见的人，永远改不了。", emph:true},
      {t:"n", x:"第二章终。"}
    ],
    next:"c3_s1"
  },

  "c3_s1":{
    ch:"第三章", chTitle:"蛙", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十四年 夏",
    card:{ num:"第 三 章", title:"蛙", sub:"—— 瓜分豆剖 ——" },
    beats:[

      {t:"n", x:"沈怀瑾从天津回来，已经一年半了。"},

      {t:"d", w:"王先生", r:"东皋书院山长", x:"沈怀瑾教出来的学生，作文里全是洋人的名字。"},
      {t:"n", x:"——"},
      {t:"n", x:"七月初三，一封信从香港来。"},
      {t:"n", x:"信封上的字，他认得。"},
      {t:"letter", title:"香港来信", to:"怀瑾兄如晤", date:"光绪二十四年 六月 于香港",
        body:"怀瑾兄如晤：\n\n别三年矣。\n\n兄在湘乡教书，弟在香港卖字。弟之族兄景高，台南陷后内渡，今在厦门，病中。\n\n附上一物，请兄细看。\n\n此图为一粤人谢君所绘，近日在香港印行，观者无不色变。弟购得十张，分寄各处。\n\n兄在湖南。湖南在内地，内地之人，看报的少，知天下事的更少。\n\n弟意，此图当比文字有用。\n\n黎景明 顿首",
        sig:"黎景明", seal:"景明"},
      {t:"n", x:"信封里还有一张纸。"},
      {t:"n", x:"纸不大，比一张信笺稍宽。是彩色石印的，颜色很鲜。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾把纸展开，放在桌上。"},
      {t:"n", x:"那是一幅中国地图。"},
      {t:"n", x:"可是地图上，爬满了东西。", emph:true},
      {t:"n", x:"北边，一头熊。很大，几乎占满了整个东北。"},
      {t:"n", x:"它趴在那里，前爪伸向山海关，身子一直压到黑龙江。"},
      {t:"n", x:"长江一带，一只老虎。虎头在江苏，虎尾拖到四川。"},
      {t:"n", x:"南边，一只青蛙。蹲在广东、广西、云南的交界处，鼓着眼睛。"},
      {t:"n", x:"山东，一条狗。蹲在胶州湾旁边。"},
      {t:"n", x:"东边的海上，一只鹰。从很远的地方飞过来，翅膀张开着。"},
      {t:"n", x:"还有一个太阳。没有画成太阳的样子，是一个圆，画在台湾和福建的上空。"},
      {t:"n", x:"——"},
      {t:"n", x:"地图的下方，画着几个人。"},
      {t:"n", x:"一个是官，穿着补褂，手里捧着一枚铜钱。"},
      {t:"n", x:"一个躺着，手里拿着一根烟枪。"},
      {t:"n", x:"一个举着一块牌子。沈怀瑾凑近看，牌子上写着两个字。"},
      {t:"n", x:"科举。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"地图的旁边，有四行字。"},
      {t:"q", x:"沉沉酣睡我中华，哪知爱国即爱家！\n国民知醒宜今醒，莫待土分裂似瓜。", src:"《时局图》题诗"},
      {t:"n", x:"沈怀瑾看着那幅图，看了很久。"},
      {t:"n", x:"他看过很多地图。《海国图志》上的，邸报上的，严先生信里画的。"},
      {t:"n", x:"那些地图上，中国是一整块。"},
      {t:"n", x:"这一张上，中国是一块被分好的肉。", emph:true}
    ],
    next:"c3_s2"
  },

  "c3_s2":{
    ch:"第三章", chTitle:"蛙", place:"湖南 · 湘乡 · 东皋书院 / 三十里外的田庄", date:"光绪二十四年 七月",
    beats:[
      {t:"n", x:"第二天，他把画片带到了书院。"},
      {t:"n", x:"学生们围上来。"},
      {t:"d", w:"学生", x:"先生，这是什么？"},
      {t:"d", w:"沈怀瑾", x:"这是中国。"},
      {t:"d", w:"学生", x:"中国……怎么是这个样子？"},
      {t:"d", w:"沈怀瑾", x:"这是别人看我们的样子。"},
      {t:"n", x:"——"},
      {t:"n", x:"学生们传着看，看得很快，也很热闹。"},
      {t:"n", x:"有人骂俄国，有人骂日本，有人问德国在哪儿。"},
      {t:"n", x:"有个学生问了一句："},
      {t:"d", w:"学生", x:"先生，那我们怎么办？"},
      {t:"n", x:"沈怀瑾张了张嘴。"},
      {t:"n", x:"他发现自己答不上来。"},
      {t:"n", x:"——"},
      {t:"n", x:"过了几天，他带着画片，去了一趟三十里外的田庄。"},
      {t:"n", x:"何伯老了很多。背更驼了，眼睛也花了。"},
      {t:"n", x:"沈怀瑾把画片摊在田埂上，指给他看。"},
      {t:"d", w:"沈怀瑾", x:"何伯，你看。这一头是俄国，占了我们的东北。"},
      {t:"d", w:"沈怀瑾", x:"这一只是英国，占了长江。"},
      {t:"d", w:"沈怀瑾", x:"这一只青蛙是法国，占了南边。"},
      {t:"n", x:"何伯凑近看。"},
      {t:"n", x:"看了半天，他问了一句："},
      {t:"d", w:"何伯", r:"佃农", x:"少东家，这画上……怎么没有我们这里？"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾愣住了。"},
      {t:"n", x:"他低头看那幅图。"},
      {t:"n", x:"湖南在中间。老虎的身子压着，可是没有爪子落在湘乡。"},
      {t:"n", x:"何伯说得对。这幅图上，没有湘乡。", emph:true},
      {t:"d", w:"何伯", x:"没有就好。"},
      {t:"d", w:"何伯", x:"少东家，这画挺好。贴墙上好看。"},
      {t:"n", x:"——"},
      {t:"n", x:"回去的路上，沈怀瑾一直在想何伯那句话。"},
      {t:"n", x:"「怎么没有我们这里。」"},
      {t:"n", x:"何伯不是不关心。他是真的没看见。"},
      {t:"n", x:"一个人一辈子没有走出过三十里地。"},
      {t:"n", x:"你告诉他东北被俄国人占了，他想象不出东北。", emph:true},
      {t:"n", x:"你告诉他中国要亡了，他也不知道「中国」是什么。"},
      {t:"n", x:"他知道的是：今年的租子能不能缓半个月。", emph:true}
    ],
    next:"c3_s3"
  },

  "c3_s3":{
    ch:"第三章", chTitle:"蛙", place:"湖南 · 长沙 · 石印铺 / 湘乡 · 沈家书房", date:"光绪二十四年 八月",
    beats:[
      {t:"n", x:"八月，沈怀瑾做了一件事。"},
      {t:"n", x:"他去了长沙，找到一家石印铺子，问印一张画片要多少钱。"},
      {t:"d", w:"石印铺掌柜", x:"这个……彩色石印，一张三分银子。"},
      {t:"d", w:"沈怀瑾", x:"印五百张呢？"},
      {t:"d", w:"石印铺掌柜", x:"十五两。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾一个月的束脩是四两。"},
      {t:"n", x:"他把这一年攒下的钱全部拿出来，又把母亲留给他的一副银镯子当了。"},
      {t:"n", x:"凑了十六两。"},
      {t:"n", x:"——"},
      {t:"n", x:"画片印出来了。五百张，用油纸包着，雇人挑回了湘乡。"},
      {t:"n", x:"堆在书房的地上，有那么高。"},
      {t:"n", x:"现在的问题是：怎么发出去。", emph:true},
      {t:"choice", prompt:"五百张《时局图》，堆在沈家书房的地上。", opts:[

  },

  "c3_s4a":{
    ch:"第三章", chTitle:"蛙", place:"湘乡 — 湘潭 · 各乡", date:"光绪二十四年 八月 — 九月",
    beats:[
      {t:"n", x:"他把画片分给了书院里三十几个学生。"},
      {t:"n", x:"每人十张，带回自己乡里。"},
      {t:"n", x:"学生们很兴奋。有人当天就动身了。"},
      {t:"n", x:"——"},
      {t:"n", x:"半个月后，反馈回来了。"},
      {t:"n", x:"有的乡里传得很开。有几个秀才把画片裱起来，挂在书房里。"},
      {t:"n", x:"有一个学生回来说，他们乡里的塾师看了图，写了四首诗。"},
      {t:"n", x:"——"},
      {t:"n", x:"也有的地方，出了事。"},
      {t:"n", x:"有个学生在湘潭发画片，被人告到县里，说是「散布妖言」。"},
      {t:"n", x:"那学生被打了二十板子。"},
      {t:"n", x:"沈怀瑾听说以后，去了一趟湘潭，把医药费送过去。"},
      {t:"n", x:"那学生趴在床上，跟他说了一件事。"},
      {t:"d", w:"学生", x:"先生，我发的时候，有个卖豆腐的老头。"},
      {t:"d", w:"学生", x:"他不识字，看了半天，问我这是什么。"},
      {t:"d", w:"学生", x:"我就把旁边那四句诗念给他听。"},
      {t:"d", w:"学生", x:"念到「莫待土分裂似瓜」，那老头哭了。"},
      {t:"d", w:"学生", x:"他哭完了跟我说：先生，你念的这是什么？我听不懂。可是我心里难受。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾回去以后，在日记里写了一句话。"},
      {t:"n", x:"「画片本身没有用。」"},
      {t:"n", x:"「有用的是念画片的人。」", emph:true},
      {t:"n", x:"三十几个学生，只发到了识字的人手里。"},
      {t:"n", x:"而识字的这三千人里，本来就知道天下事。", emph:true}
    ],
    next:"c3_s5"
  },

  "c3_s4b":{
    ch:"第三章", chTitle:"蛙", place:"湘乡 · 城隍庙", date:"光绪二十四年 九月",
    beats:[
      {t:"n", x:"九月，城隍庙会。"},
      {t:"n", x:"湘乡的庙会一年一次，三天。四面八方的乡民都来。"},
      {t:"n", x:"卖农具的，卖布匹的，耍猴的，唱花鼓戏的，算命测字的。"},
      {t:"n", x:"沈怀瑾在庙会边上找了一块空地，把画片钉在木板上，立起来。"},
      {t:"n", x:"——"},
      {t:"n", x:"第一个上午，围了很多人。"},
      {t:"n", x:"沈怀瑾站在旁边，一张一张地讲。"},
      {t:"n", x:"讲俄国人怎么占的东北，讲英国人怎么占的长江，讲台湾怎么割的。"},
      {t:"n", x:"讲到中午，嗓子哑了。"},
      {t:"n", x:"——"},
      {t:"n", x:"下午，来了几个穿短打的。"},
      {t:"d", w:"庙会上的人", x:"你这是什么东西？"},
      {t:"d", w:"沈怀瑾", x:"中国的时局图。"},
      {t:"d", w:"庙会上的人", x:"什么时局？"},
      {t:"d", w:"庙会上的人", x:"我看你这画上，画的都是畜生。"},
      {t:"d", w:"庙会上的人", x:"把畜生画在中国的地上，你安的什么心？"},
      {t:"n", x:"围的人哄起来了。"},
      {t:"n", x:"有人喊：妖言惑众！"},
      {t:"n", x:"有人喊：把板子砸了！"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾没有跑。"},
      {t:"n", x:"他把画片从木板上揭下来，抱在怀里。"},
      {t:"n", x:"然后他站到人群中间，大声说了一句话。"},
      {t:"d", w:"沈怀瑾", x:"诸位！这画不是我画的！"},
      {t:"d", w:"沈怀瑾", x:"是外国人画的！"},
      {t:"d", w:"沈怀瑾", x:"他们就是这么看我们的！"},
      {t:"n", x:"人群静了一下。"},
      {t:"n", x:"——"},
      {t:"n", x:"最后是一个卖菜的老妇人先走的。"},
      {t:"n", x:"她走的时候说了一句："},
      {t:"d", w:"卖菜的老妇人", x:"我们晓得又怎么样。"},
      {t:"d", w:"卖菜的老妇人", x:"晓得，地还是要种，租还是要交。"},
      {t:"n", x:"——"},
      {t:"n", x:"那天沈怀瑾发出去七十几张。"},
      {t:"n", x:"剩下的，堆在书房里。"},
      {t:"n", x:"晚上他坐在那堆画片旁边，想了很久。"},
      {t:"n", x:"他想的是那个老妇人的话。"},
      {t:"n", x:"「晓得又怎么样。」", emph:true},
      {t:"n", x:"这句话比「妖言惑众」难回答得多。"},
      {t:"n", x:"骂他妖言的人，至少还在生气。"},
      {t:"n", x:"而这个老妇人，已经不生气了。", emph:true}
    ],
    next:"c3_s5"
  },

  "c3_s4c":{
    ch:"第三章", chTitle:"蛙", place:"湘乡 · 县学", date:"光绪二十四年 九月",
    beats:[
      {t:"n", x:"县学的教谕姓黄，是沈鹤龄的老相识。"},
      {t:"n", x:"沈怀瑾带了十张画片去见他。"},
      {t:"n", x:"黄教谕看了很久。"},
      {t:"d", w:"黄教谕", r:"湘乡县学教谕", x:"这图，是哪里来的？"},
      {t:"d", w:"沈怀瑾", x:"香港。"},
      {t:"d", w:"黄教谕", x:"香港。"},
      {t:"n", x:"他把画片放下，用手指按着。"},
      {t:"d", w:"黄教谕", x:"怀瑾，你在书院教书，是好事。"},
      {t:"d", w:"黄教谕", x:"可这个东西，不能由县学发。"},
      {t:"d", w:"沈怀瑾", x:"为什么？"},
      {t:"d", w:"黄教谕", x:"因为上头没有发。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾还想说什么。"},
      {t:"n", x:"黄教谕摆了摆手。"},
      {t:"d", w:"黄教谕", x:"我知道你想说什么。"},
      {t:"d", w:"黄教谕", x:"你说的都是真的。"},
      {t:"d", w:"黄教谕", x:"可是你想想：这张图如果从县学发出去，传到府里，传到省里——"},
      {t:"d", w:"黄教谕", x:"上头问起来，第一个被问的是谁？"},
      {t:"d", w:"黄教谕", x:"是我。"},
      {t:"d", w:"黄教谕", x:"我倒了，县学就没人管。县学没人管，这几十个童生就没处读书。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾把那十张画片收了起来。"},
      {t:"n", x:"临走的时候，黄教谕忽然叫住他。"},
      {t:"d", w:"黄教谕", x:"怀瑾。"},
      {t:"d", w:"黄教谕", x:"你自己留一张。"},
      {t:"d", w:"黄教谕", x:"剩下的，我买。"},
      {t:"d", w:"沈怀瑾", x:"买？"},
      {t:"d", w:"黄教谕", x:"我私人买。不算县学的。"},
      {t:"d", w:"黄教谕", x:"我寄给几个老朋友。他们在别的县做教谕。"},
      {t:"n", x:"——"},
      {t:"n", x:"那天沈怀瑾走出县学，回头看了一眼。"},
      {t:"n", x:"黄教谕还站在门口。他背着手，看着天。"},
      {t:"n", x:"沈怀瑾忽然觉得，这个人也是醒着的。"},
      {t:"n", x:"只是他醒着的方式，跟他不一样。", emph:true}
    ],
    next:"c3_s5"
  },

  "c3_s5":{
    ch:"第三章", chTitle:"蛙", place:"湖南 · 湘乡 · 东皋书院", date:"光绪二十四年 冬",
    beats:[
      {t:"n", x:"冬天，沈怀瑾在书院里做了一件事。"},
      {t:"n", x:"他把《时局图》挂在了讲堂的墙上。"},
      {t:"n", x:"山长王先生来看了，站了很久。"},
      {t:"n", x:"沈怀瑾以为他要发火。"},
      {t:"n", x:"王先生没有。他问了一句："},
      {t:"d", w:"王先生", r:"东皋书院山长", x:"这上面的字，是「莫待土分裂似瓜」？"},
      {t:"d", w:"沈怀瑾", x:"是。"},
      {t:"n", x:"王先生点点头，走了。"},
      {t:"n", x:"第二天，他在课上给学生讲了一篇《孟子》。"},
      {t:"n", x:"讲的是「生于忧患，死于安乐」。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"这一年冬天，沈怀瑾想明白了一件事。"},
      {t:"n", x:"一张画片，改变不了什么。"},
      {t:"n", x:"湘乡县三十万人。识字的不到三千。"},
      {t:"n", x:"而识字的这三千人里，大部分是读书人。读书人本来就知道天下的事。"},
      {t:"n", x:"剩下二十九万七千人，你给他们画片，他们看不懂。"},
      {t:"n", x:"你给他们讲，他们听不进去。"},
      {t:"n", x:"不是他们蠢。", emph:true},
      {t:"n", x:"是他们从来没有学过，怎么听懂。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"他想起严先生信里的话：鼓民力，开民智，新民德。"},
      {t:"n", x:"他从前以为，「开民智」就是写文章给人看。"},
      {t:"n", x:"现在他知道了：写文章，只能开已经开了的智。", emph:true},
      {t:"n", x:"要开没开的智，得办学堂。"},
      {t:"n", x:"得从七八岁的孩子教起。教他们认字，教他们算数，教他们知道中国有多大。"},
      {t:"n", x:"这件事，二十年才看得见结果。"},
      {t:"n", x:"——"},
      {t:"n", x:"那天晚上，他在灯下写了一行字。"},
      {t:"n", x:"「欲开民智，必自蒙学始。」"},
      {t:"n", x:"这一行字，后来变成了湘乡第一所新式小学堂。", emph:true}
    ],
    next:"c3_l1"
  },

  "c3_l1":{
    ch:"第三章", chTitle:"蛙", place:"上海 — 香港 · 海船上", date:"光绪二十四年 三月",
    beats:[
      {t:"n", x:"——"},
      {t:"n", x:"同一年，春。上海。"},
      {t:"n", x:"光绪二十四年三月，林婉如去了一趟广州。"},
      {t:"n", x:"恒昌洋行在广州有一笔生丝的纠纷。"},
      {t:"n", x:"三百担丝，从广州运到上海，货主说是湿的，要退货。"},
      {t:"n", x:"洋经理不愿意自己跑。林伯渊年纪大了，也不愿意动。"},
      {t:"n", x:"林婉如说：我去。"},
      {t:"n", x:"——"},
      {t:"n", x:"船走了五天。"},
      {t:"n", x:"第四天，在香港靠岸加煤。"},
      {t:"n", x:"林婉如上了岸。"},
      {t:"n", x:"香港是英国人的。街道是英国人的名字，巡捕是印度人，招牌上是英文和中文并排。"},
      {t:"n", x:"她在皇后大道上走了一段。"},
      {t:"n", x:"——"},
      {t:"n", x:"然后她看见了那张画片。"},
      {t:"n", x:"就在路边一家书铺的橱窗里，摆着几十张，彩色石印，用夹子夹着挂起来。"},
      {t:"n", x:"画的是中国。"},
      {t:"n", x:"画上爬满了东西。"},
      {t:"n", x:"她站在橱窗前看了很久。"},
      {t:"n", x:"她认得图上的每一只动物。"},
      {t:"n", x:"不是因为她见过这幅图。是因为她在洋行的账本上，见过它们。", emph:true},
      {t:"n", x:"熊是俄国的。老虎是英国的。青蛙是法国的。太阳是日本的。"},
      {t:"n", x:"那只鹰，她没有见过。她猜是美国。"},
      {t:"n", x:"——"},
      {t:"n", x:"她花了两个银角，买了一张。"},
      {t:"n", x:"书铺的伙计用纸卷好，递给她。"},
      {t:"d", w:"书铺伙计", x:"小姐是内地来的？"},
      {t:"d", w:"林婉如", x:"是。"},

      {t:"d", w:"卖凉茶的老人", x:"说是要租广州湾。"},
      {t:"d", w:"卖凉茶的老人", x:"租就租吧。反正也不在这儿。"},
      {t:"n", x:"——"},
      {t:"n", x:"「反正也不在这儿。」"},
      {t:"n", x:"林婉如后来想起这句话，想起过很多次。"},
      {t:"n", x:"——"},
      {t:"n", x:"她在江边站了很久。"},
      {t:"n", x:"她想起两年前，上海十六铺码头上的那个上午。"},
      {t:"n", x:"那时候她也是这样站着，跟一个洋人说话，说得又快又流利。"},
      {t:"n", x:"那时候她觉得自己很了不起。"},
      {t:"n", x:"现在她知道了：能跟洋人吵架，不等于能跟洋人平起平坐。", emph:true}

  "c3_l3":{

      {t:"d", w:"梁先生", x:"老百姓把木桩拔了。"},

      {t:"d", w:"梁先生", x:"后来各乡自己出了人，出了枪，凑了民团。"},
      {t:"d", w:"梁先生", x:"李大人也帮我们。他给了粮，给了火药。"},
      {t:"d", w:"梁先生", x:"已经打过几场了。"},
      {t:"n", x:"——"},
      {t:"d", w:"林婉如", x:"梁先生，你们打，打得过么？"},
      {t:"n", x:"梁先生看着她，看了很久。"},
      {t:"d", w:"梁先生", x:"打不过。"},
      {t:"d", w:"梁先生", x:"法国人有兵舰，有快枪。我们有的是锄头、鸟枪，还有几杆土炮。"},
      {t:"d", w:"梁先生", x:"打不过。"},
      {t:"n", x:"他把碗里最后一口饭吃完。"},
      {t:"d", w:"梁先生", x:"可是姑娘，我告诉你一件事。"},
      {t:"d", w:"梁先生", x:"我们村里的人，从前谁也不知道「法国」是什么。"},
      {t:"d", w:"梁先生", x:"现在他们知道了。"},
      {t:"d", w:"梁先生", x:"知道了，就拔他的桩子。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"那天晚上，林婉如把这句话记在了本子上。"},
      {t:"n", x:"「知道了，就拔他的桩子。」"},
      {t:"n", x:"她又想起上海白鹅潭边上那个卖凉茶的老人。"},
      {t:"n", x:"「反正也不在这儿。」"},
      {t:"n", x:"两句话，说的是同一件事的两头。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"她忽然想起一件事。"},
      {t:"n", x:"台湾。"},
      {t:"n", x:"台湾被割掉的时候，北京的一千多个举子上了书。"},
      {t:"n", x:"台湾的人，自己定了个年号，叫永清。"},
      {t:"n", x:"因为他们知道，那块地是他们的。", emph:true}
    ],
    next:"c3_l4"
  },

        body:"粤东客妇台鉴：\n\n大稿拜读。文笔老到，叙事如见，非寻常闺阁笔墨。\n\n所记广州湾事，馆中同人传阅，无不愤然。\n\n然此稿不能登。\n\n非为文笔，非为事实。为的是本馆已在风浪之中。近日京中有人参劾本馆「惑乱人心」，馆中诸事，皆须审慎。\n\n大稿已抄录三份，分寄天津、长沙、香港三处友人。此三处，或有能登之者。\n\n另：女士前此所寄电报抄件，已为有用之资。多谢。\n\n此后若再有见闻，仍望赐示。惟务请珍重，勿以身试险。\n\n周 顿首",

      {t:"q", x:"沉沉酣睡我中华，哪知爱国即爱家！\n国民知醒宜今醒，莫待土分裂似瓜。",
        src:"谢缵泰《时局图》题诗，光绪二十四年"},

      {t:"n", x:"这一年，中国有三个人在三个地方，各做了一件事。"},
      {t:"n", x:"在香港，一个人画了一张图。"},
      {t:"n", x:"在湖南，一个教书先生把图印了五百张，发出去七十几张。"},
      {t:"n", x:"在上海，一个洋行里的姑娘把图折好，压在箱底。"},

      {t:"n", x:"图上那只青蛙，蹲在两广和云贵的交界处。"},
      {t:"n", x:"它不叫。"},
      {t:"n", x:"青蛙从来不用叫。"},
      {t:"n", x:"它只是蹲着，等虫子自己飞过来。", emph:true},

  "c4_1":{

    card:{ num:"第 四 章", title:"太阳", sub:"—— 台湾的悲剧 ——" },

      {t:"n", x:"这一年，北京出了大事。"},

      {t:"n", x:"九月二十一，太后从颐和园回宫，训政。"},

      {t:"n", x:"九月二十八，菜市口。"},

      {t:"n", x:"浏阳离湘乡，三百里。", emph:true},

      {t:"n", x:"包得很大，用油布裹着，外面还缠了麻绳。"},
      {t:"n", x:"拆开，里面是一叠信。"},
      {t:"n", x:"十几封。纸有黄的，有白的，有毛边的，有印着竖格子的。"},
      {t:"n", x:"最上面压着一封短信。"},
      {t:"letter", title:"香港来信", to:"怀瑾兄", date:"光绪二十四年 十月 于香港",
        body:"怀瑾兄：\n\n景高兄殁了。十月十一，在厦门。\n\n病是肺上的病，拖了三年。最后那几天他不说话，只是看着北边。\n\n弟去厦门收殓。他没有家眷，只有一口箱子。\n\n箱子里有十几封信，都是写给你的。一封也没有寄出去。\n\n不是他不想寄。是寄不出去。台湾割了以后，邮路就断了。信到了厦门，就停在那里。\n\n他一直以为你不回信。\n\n弟把这些信带来香港，现在寄给你。\n\n兄若肯读，请读。读完了怎么处置，都随兄。\n\n黎景明 顿首",
        sig:"黎景明", seal:"景明"},
      {t:"n", x:"沈怀瑾把那封短信看了两遍。"},
      {t:"n", x:"然后他数了数那叠信。"},
      {t:"n", x:"十四封。"},
      {t:"n", x:"最早的一封，日期是光绪二十一年五月。"},
      {t:"n", x:"最近的一封，是今年十月。"},
      {t:"n", x:"三年零五个月。"},
      {t:"n", x:"——"},
      {t:"n", x:"他坐在灯下，拆开了第一封。"}
    ],
    next:"c4_2"
  },

  "c4_2":{
    ch:"第四章", chTitle:"太阳", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十一年 五月 于台北（三年前）",
    beats:[
      {t:"letter", title:"第一封", to:"怀瑾兄", date:"光绪二十一年 五月初八 于台北",
        body:"怀瑾兄：\n\n京中一别，忽忽一月。\n\n兄在会馆里说「我认得台湾」的时候，弟在门外听见了。弟没有进去。\n\n台事已定。朝廷弃台，台民不肯弃。\n\n本月初二，官绅于台北立「台湾民主国」，年号永清，旗用蓝地黄虎，虎首内向，以示心向神州之意。唐抚台为总统。\n\n兄知此举于势无补。然二百万人的身家性命，总得有人替他们喊一声。\n\n弟已决意留此。\n\n弟在台南府做了六年官。府库里有多少粮，炮台上还有几门炮，弟心里有数。\n\n不够。\n\n可是弟还是想请兄来。\n\n台湾缺的不是枪。台湾缺的是有人替我们说话。\n\n兄是湖南人，会写文章。\n\n若兄肯来，弟在淡水港接你。\n\n弟 景高 手书",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"沈怀瑾把这封信放下。"},
      {t:"n", x:"他记得那一天。"},
      {t:"n", x:"会馆的台阶，酒壶，还有黎景明那双红眼睛。"},
      {t:"n", x:"他确实说过「我认得台湾」。"},
      {t:"n", x:"他说完那句话，觉得自己很了不起。"},
      {t:"n", x:"——"},
      {t:"n", x:"「若兄肯来，弟在淡水港接你。」"},
      {t:"n", x:"他没有去。"},
      {t:"n", x:"他往南走了。走的是运河，是湖南，是湘乡。"},
      {t:"n", x:"他把那个地址放在箱子底下，放了三年。", emph:true},
      {t:"n", x:"他拆开了第二封。"}
    ],
    next:"c4_3"
  },

  "c4_3":{
    ch:"第四章", chTitle:"太阳", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十一年 六月 ／ 八月",
    beats:[
      {t:"letter", title:"第二封", to:"怀瑾兄", date:"光绪二十一年 六月 于淡水",
        body:"怀瑾兄：\n\n台北没了。\n\n五月二十九，日人于澳底登陆。六月三，狮球岭失守，基隆陷。\n\n六月四日夜里，唐抚台换了便服，从抚署后门出去，走到淡水。六月六，搭德国轮船内渡厦门。\n\n他走的时候，抚署里还挂着那面蓝地黄虎旗。\n\n六月七，日人入台北。六月十七，桦山资纪在台北举行始政式。\n\n前后十九天。\n\n弟没有走。弟跟着溃兵往南。\n\n路上遇见丘逢甲。他从台中带了两千义军北上，走到半路，听说台北已失，就停住了。\n\n他站在路边，站了很久，然后说了一句话：\n\n「吾台人自问，何负于朝廷。」\n\n弟记下了这一句。\n\n弟 景高 手书",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"——"},
      {t:"letter", title:"第三封", to:"怀瑾兄", date:"光绪二十一年 九月 于彰化",
        body:"怀瑾兄：\n\n弟现在彰化。\n\n台中一带，还有人在打。\n\n新竹有吴汤兴，苗栗有徐骧，还有姜绍祖。三个人，都是二十几岁的读书人。他们散尽家财，招了几千乡民，拿的是鸟枪、锄头、竹矛。\n\n日本人管他们叫「土匪」。台湾人叫他们义军。\n\n他们打过几场胜仗。有一回在新竹城外伏击，日本人退了三里。\n\n那是五月里的事。\n\n——\n\n七月，姜绍祖被俘。他不肯降，在狱里自尽了。\n\n八月二十八，八卦山。\n\n日人攻彰化，义军守八卦山。山上只有几门旧炮，炮口还是朝海的。\n\n打了一天。\n\n吴汤兴死在山上。徐骧带人突围，往南去了。弟不知道他还能走多远。\n\n彰化陷。\n\n——\n\n兄，弟写这封信的时候，手是抖的。\n\n不是因为怕。是因为弟算了一笔账：\n\n这三个年轻人，家里都有田，有屋，有书。他们本可以安安静静做一辈子读书人。\n\n他们把钱花光了，把人带出去了，把自己也赔进去了。\n\n换来的是——十九天，三个月，一个八卦山。\n\n弟算不明白这笔账。\n\n弟 景高 手书",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"沈怀瑾读完，站起来，走到窗边。"},
      {t:"n", x:"外面在下雨。湘乡冬天的雨，又冷又细。"},
      {t:"n", x:"他想起严先生讲过的一句话。"},
      {t:"n", x:"物竞天择，适者生存。"},
      {t:"n", x:"严先生说，这句话是讲万物的。"},
      {t:"n", x:"沈怀瑾从前觉得，这句话讲的是道理。"},
      {t:"n", x:"现在他觉得，这句话讲的是人。", emph:true},
      {t:"n", x:"讲的是吴汤兴、徐骧、姜绍祖这三个人。"},
      {t:"n", x:"他们不适。所以他们死了。", emph:true}
    ],
    next:"c4_4"
  },

  "c4_4":{

    beats:[
      {t:"letter", title:"第四封", to:"怀瑾兄", date:"光绪二十一年 十月 于台南",
        body:"怀瑾兄：\n\n台南也没了。\n\n十月十九，刘永福内渡厦门。十月二十一，日人入台南。\n\n台湾民主国，前后一百四十九天。\n\n——\n\n徐骧也死了。十月里，在曾文溪。\n\n弟在九月里说过，不知道他还能走多远。现在知道了。\n\n——\n\n弟藏在一户人家的柴房里，写了这封信。\n\n写的时候，弟在想一件事：\n\n这一百四十七天里，朝廷做过什么？\n\n没有。\n\n一两银子没有，一杆枪没有，一道诏书也没有。\n\n朝廷说过的话只有一句：这是已经议定的事，不许再闹。\n\n——\n\n那么弟是在替谁守？\n\n弟想了很多天，想明白了：\n\n弟不是替朝廷守。弟是替这块地上的人守。\n\n朝廷可以不要台湾。台湾的人不能不要台湾。\n\n弟 景高 手书",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"沈怀瑾把这封信放在桌上。"},
      {t:"n", x:"「朝廷可以不要台湾。台湾的人不能不要台湾。」"},
      {t:"n", x:"他想起三年前，都察院门口那一天。"},
      {t:"n", x:"一千多个举子跪在那里，门没有开。"},
      {t:"n", x:"他们跪的是朝廷。"},
      {t:"n", x:"而黎景高在台湾，守的已经不是朝廷了。", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"他拆开了第五封。"}
    ],
    next:"c4_5"
  },

  "c4_5":{
    ch:"第四章", chTitle:"太阳", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十二年 六月 于云林",
    beats:[
      {t:"letter", title:"第五封", to:"怀瑾兄", date:"光绪二十二年 六月 于云林",
        body:"怀瑾兄：\n\n弟现在云林，一个叫斗六的地方。\n\n去年十月以后，弟没有走。弟在乡下教书。教几个孩子认字，一天收两升米。\n\n——\n\n今年六月，日本人来收税，斗六一带的人不肯交。有人打了日本人的派出所。\n\n日本人派兵来了。\n\n他们在斗六、大埤一带，见人就杀。\n\n杀了几天，弟不知道。弟躲在甘蔗田里。\n\n出来的时候，村子没了。\n\n弟教的那几个孩子，弟不知道他们去哪儿了。\n\n——\n\n兄，弟从前以为，最坏的事是亡国。\n\n现在弟知道了，不是。\n\n最坏的事，是亡国之后的日子。\n\n亡国是一天的事。亡国之后，是每一天的事。",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"沈怀瑾把信放下。"},
      {t:"n", x:"信纸的下角，有一小块褐色的印子。"},

      {t:"n", x:"他看了很久，没有去碰它。"},
      {t:"n", x:"——"},
      {t:"n", x:"他想起湘乡城隍庙会上，那个卖菜的老妇人。"},
      {t:"n", x:"「我们晓得又怎么样。晓得，地还是要种，租还是要交。」"},
      {t:"n", x:"他从前答不上来。"},
      {t:"n", x:"现在他有了一个答案。"},
      {t:"n", x:"一个很坏的答案。", emph:true},

  "c4_6":{
    ch:"第四章", chTitle:"太阳", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十三年 四月 于台湾",
    beats:[
      {t:"letter", title:"第六封", to:"怀瑾兄", date:"光绪二十三年 四月 于台湾",
        body:"怀瑾兄：\n\n有一件事，弟想了三个月，今天必须写下来。\n\n《马关条约》上有一条：台湾居民，限两年之内，可任意变卖产业迁出。两年期满仍在台湾者，即视为日本臣民。\n\n两年之期，到今年五月初八为止。\n\n——\n\n这三个月，台北、台中、台南，到处有人在收拾行李。\n\n有钱的先走。他们把田卖了，把铺子盘了，带着银子去厦门、去汕头、去香港。\n\n没钱的走不了。田卖不掉，人走不动。\n\n五月初八那一天，弟去了台南的衙门。\n\n门口排着队。登记离台的，一天有几百人。\n\n弟排在队里，排到一半，出来了。\n\n——\n\n兄问弟为什么。\n\n弟说不清。\n\n弟只能说：弟的父亲葬在台南。弟的儿子生在台南。\n\n弟要是走了，这两件事就没有地方放了。\n\n弟留下了。\n\n从今天起，弟是日本臣民。\n\n弟写这封信的时候，用的是中国字。",
        sig:"黎景高", seal:"景高"},
      {t:"n", x:"沈怀瑾把这封信读了三遍。"},
      {t:"n", x:"最后一句，他读了很久。"},
      {t:"n", x:"「弟写这封信的时候，用的是中国字。」"},
      {t:"n", x:"——"},
      {t:"n", x:"光绪二十三年五月初八。", emph:true},

      {t:"n", x:"同一天，沈怀瑾在湘乡。", emph:true},
      {t:"n", x:"他在做什么？"},
      {t:"n", x:"他在给学生讲《孟子》。"},

  "c4_7":{
    ch:"第四章", chTitle:"太阳", place:"湖南 · 湘乡 · 沈家书房", date:"光绪二十四年 十月 于厦门",
    beats:[
      {t:"n", x:"最后一封。"},

      {t:"letter", title:"第七封（最后一封）", to:"怀瑾兄", date:"光绪二十四年 十月 于厦门",
        body:"怀瑾兄：\n\n弟在厦门。病重，不能起身。写这封信，写了三天。\n\n——\n\n光绪二十三年冬天，弟从台湾出来了。不是因为改籍的事。是因为弟在乡下教的书里，有几句被人告了。\n\n弟到了厦门，才知道自己的病。\n\n——\n\n兄，弟有一件事，想了三年，今天要说。\n\n弟在台北写第一封信给你的时候，是二十一年五月。那封信里，弟请你来。\n\n弟等了很久，没有回信。\n\n弟后来想，也许兄觉得，台湾的事与湖南无关。\n\n也许兄是对的。\n\n——\n\n可是弟还是想问一句：\n\n如果那年你来了，会不会不一样？\n\n弟知道这句话没有道理。弟一个人来不来，改变不了什么。\n\n但弟还是想问。\n\n——\n\n弟这一生，做过一件事，也做错了一件事。\n\n做对的那件，是留下。\n\n做错的那件，也是留下。\n\n弟到死也没有想明白，这两件事为什么是同一件。\n\n——\n\n这十几封信，弟一直带着。本来想寄给你。寄不出去。\n\n现在托景明弟转交。\n\n兄若读到，就当弟在你面前，把话说完了吧。\n\n弟 景高 绝笔",
        sig:"黎景高", seal:"景高"},

  "c5_3":{
    ch:"第五章", chTitle:"狮", place:"湖南 · 浏阳 — 湘乡", date:"光绪二十五年 二月",
    beats:[
      {t:"n", x:"回湘乡的路上，他绕了一趟浏阳。"},
      {t:"n", x:"谭家的老宅在城里的巷子里。门锁着，锁上落了灰。"},
      {t:"n", x:"他敲了门，没有人应。"},
      {t:"n", x:"隔壁的妇人探出头来。"},

      {t:"d", w:"邻人", x:"灵柩还在北京。浏阳会馆的刘先生给收着，一直没运回来。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾站在门口。"},
      {t:"n", x:"他没有进去，也没有走。"},

      {t:"d", w:"沈怀瑾", x:"我看了两遍，然后压在砚台底下。"},
      {t:"d", w:"沈怀瑾", x:"我不是来祭你的。"},
      {t:"d", w:"沈怀瑾", x:"我是来告诉你：我明年还来。"},
      {t:"n", x:"——"},
      {t:"n", x:"回到湘乡，他父亲在院子里晒书。"},
      {t:"n", x:"线装书摊了一院子，风一吹，纸页哗哗地响。"},
      {t:"d", w:"沈鹤龄", x:"去了浏阳？"},
      {t:"d", w:"沈怀瑾", x:"去了。"},
      {t:"d", w:"沈鹤龄", x:"谭家的门，我也敲过。"},
      {t:"n", x:"沈怀瑾愣住了。"},
      {t:"d", w:"沈鹤龄", x:"去年冬天去的。一个人去的，没跟人说。"},
      {t:"d", w:"沈鹤龄", x:"我在那儿站了半天，想明白一件事。"},
      {t:"d", w:"沈鹤龄", x:"我这一辈子，信过两样东西。"},
      {t:"d", w:"沈鹤龄", x:"先是朝廷，后来是洋务。"},
      {t:"d", w:"沈鹤龄", x:"两样都塌了。"},
      {t:"d", w:"沈鹤龄", x:"我六十了，来不及再信第三样。"},
      {t:"d", w:"沈鹤龄", x:"你才二十五。你来得及。"},
      {t:"n", x:"——"},
      {t:"n", x:"他把手里的一本书合上，放回箱子里。"},
      {t:"d", w:"沈鹤龄", x:"你要走就走吧。家里有我。"},
      {t:"n", x:"沈怀瑾跪下来，磕了个头。"},

      {t:"n", x:"院子里的书还在哗哗地响。"}

  "c5_l1":{
    ch:"第五章", chTitle:"狮", place:"上海 · 江西路 · 恒昌洋行", date:"光绪二十五年 三月",
    beats:[
      {t:"n", x:"上海。三月。江西路那栋三层砖楼，还是老样子。"},
      {t:"n", x:"林婉如从广东回来，已经半年了。"},
      {t:"n", x:"恒昌洋行的账，一年不如一年。"},
      {t:"n", x:"——"},
      {t:"d", w:"克纳普", x:"林小姐，我需要跟你谈一谈纱。"},
      {t:"n", x:"克纳普是德国人，做了二十年生丝转口。这两年他改做棉纱了。"},
      {t:"d", w:"克纳普", x:"日本纱比我们便宜三成。三成。"},
      {t:"d", w:"克纳普", x:"上海的织厂，现在只买日本纱。"},
      {t:"d", w:"林婉如", x:"我们的纱从哪里来？"},
      {t:"d", w:"克纳普", x:"曼彻斯特。还有孟买。"},
      {t:"d", w:"林婉如", x:"中国自己的纱呢？"},
      {t:"n", x:"克纳普笑了。"},
      {t:"d", w:"克纳普", x:"中国有自己的纱吗？"},
      {t:"n", x:"——"},
      {t:"n", x:"林婉如没有回答。"},
      {t:"n", x:"她想起两年前，在这间公事房里见过的那个人。"},
      {t:"n", x:"南通来的状元。他说他要办一个纱厂。"},
      {t:"n", x:"那时候他连股本都收不齐。"},
      {t:"n", x:"她当时想：这个人大概办不成。"}
    ],
    next:"c5_l2"
  },

  "c5_l2":{
    ch:"第五章", chTitle:"狮", place:"上海 · 虹口 · 林家", date:"光绪二十五年 三月",
    beats:[
      {t:"n", x:"那天晚上，她在报上看到一条消息。"},
      {t:"q", x:"通州大生纱厂，机器装齐，闻将于四月开车。",
        src:"光绪二十五年三月 上海各报"},
      {t:"n", x:"她看了两遍。"},
      {t:"n", x:"——"},
      {t:"n", x:"她翻出抽屉底下的那张名片。两年前的，已经黄了。"},
      {t:"n", x:"名片上四个字：张季直。旁边一行小字：通州大生纱厂。"},
      {t:"n", x:"她给南通写了一封信。"},
      {t:"n", x:"信上只有一句话。"},
      {t:"n", x:"「纱厂开车之日，能否容我一观。」"},
      {t:"n", x:"——"},
      {t:"n", x:"回信很快。"},
      {t:"n", x:"一个字。"},
      {t:"n", x:"「可。」", emph:true},
      {t:"n", x:"——"},
      {t:"n", x:"她拿着那封信，坐了很久。"},
      {t:"n", x:"然后她做了一件自己也没想到的事。"},
      {t:"n", x:"她翻开账本，把恒昌洋行这七年她经手的每一笔生意，从头看了一遍。"},
      {t:"n", x:"看完，她算了一个数。"},
      {t:"n", x:"这个数，是她这七年替洋行赚的钱，减去林家分到的钱。"},
      {t:"n", x:"差得很远。"},
      {t:"n", x:"她把账本合上，没有告诉任何人。"}
    ],
    next:"c5_l3"
  },

  "c5_l3":{
    ch:"第五章", chTitle:"狮", place:"江苏 · 通州 · 唐家闸", date:"光绪二十五年 四月",
    beats:[
      {t:"n", x:"南通，四月。纱厂在城西唐家闸，临着通扬运河。"},
      {t:"n", x:"厂房是新的。砖墙，铁皮顶，烟囱很高。"},
      {t:"n", x:"张謇在门口等她。他瘦了很多。"},
      {t:"d", w:"张謇", x:"林小姐。你来了。"},
      {t:"d", w:"林婉如", x:"张先生。"},
      {t:"d", w:"张謇", x:"我先带你看一样东西。"},
      {t:"n", x:"他带她去看仓库。"},
      {t:"n", x:"仓库里堆着棉花，也堆着纱。"},
      {t:"d", w:"张謇", x:"这些是试车的时候纺的。"},
      {t:"d", w:"张謇", x:"两万零四百锭，只开了一半。"},
      {t:"d", w:"林婉如", x:"为什么只开一半？"},
      {t:"d", w:"张謇", x:"因为钱只够一半。"},
      {t:"n", x:"——"},
      {t:"d", w:"张謇", x:"我跟你说实话。"},
      {t:"d", w:"张謇", x:"这个厂，从光绪二十一年动议，到今天，四年。"},
      {t:"d", w:"张謇", x:"中间停过三次。有一回是真的要散了，股本收不齐。"},
      {t:"d", w:"张謇", x:"我把字画卖了，卖了一千多两。不够。"},
      {t:"d", w:"张謇", x:"后来是刘岘庄把官机折了价，作股进来，厂才活下来。"},
      {t:"d", w:"张謇", x:"官股一进来，这个厂就不全是我的了。"},
      {t:"d", w:"林婉如", x:"那张先生图什么？"},
      {t:"n", x:"张謇没有立刻回答。"},
      {t:"n", x:"他带她走到车间门口。"},
      {t:"n", x:"门开着。里面是机器的声音。"},
      {t:"n", x:"很大的声音。人说话要凑到耳边才听得见。"},
      {t:"d", w:"张謇", x:"你听。"},
      {t:"n", x:"——"},
      {t:"d", w:"张謇", x:"林小姐，日本纱为什么便宜？"},
      {t:"d", w:"张謇", x:"因为日本人自己有厂，有船，有银行。"},
      {t:"d", w:"张謇", x:"他们的纱从大阪上船，到上海下船，中间每一道，钱都是自己赚的。"},
      {t:"d", w:"张謇", x:"我们的纱，从通州上船，要先押给上海的洋行。洋行再卖给织厂。"},
      {t:"d", w:"张謇", x:"钱都让中间拿走了。"},
      {t:"d", w:"张謇", x:"所以我要办的，不只是一个厂。"},
      {t:"d", w:"张謇", x:"是厂，是垦牧，是学堂，是银行。"},
      {t:"d", w:"林婉如", x:"这些都要钱。"},
      {t:"d", w:"张謇", x:"要。"},
      {t:"d", w:"张謇", x:"所以我这辈子，大概就是个到处化缘的和尚。"},
      {t:"n", x:"他笑了一下。笑得很难看。"}
    ],
    next:"c5_l4"
  },

  "c5_l4":{

  "c5_5":{
    ch:"第五章", chTitle:"狮", place:"上海 · 四马路 · 书铺", date:"光绪二十五年 秋",
    beats:[
      {t:"n", x:"秋天。上海，四马路。"},
      {t:"n", x:"沈怀瑾是七月到上海的。"},
      {t:"n", x:"他在一家书铺里做事。抄书，校书，也替人代写书信。"},
      {t:"n", x:"工钱很少，够吃饭。"},
      {t:"n", x:"空闲的时候他看书。看得最多的是《天演论》。"},
      {t:"n", x:"——"},
      {t:"n", x:"那天下午，店里来了一个女客。"},
      {t:"n", x:"二十出头，穿一身素色的衫裙，说话带一点广东口音。"},
      {t:"n", x:"她要找一样东西。"},
      {t:"d", w:"林婉如", x:"有没有《时局图》？"},
      {t:"n", x:"伙计说没有。"},
      {t:"n", x:"沈怀瑾抬起头。"},
      {t:"d", w:"沈怀瑾", x:"那幅画，不是书。"},
      {t:"d", w:"林婉如", x:"我知道不是书。"},
      {t:"d", w:"林婉如", x:"前年香港印过一批画片。后来没有再印。"},
      {t:"d", w:"林婉如", x:"我想找一张。"},
      {t:"n", x:"——"},
      {t:"n", x:"沈怀瑾从柜台下面拿出一张纸。"},
      {t:"n", x:"纸是黄的，边上破了。上面画着中国，中国上面趴着熊、鹰、犬、蛤蟆、太阳。"},
      {t:"d", w:"沈怀瑾", x:"我有一张。"},
      {t:"d", w:"沈怀瑾", x:"我自己石印过五百张。这是剩下的一张。"},
      {t:"n", x:"林婉如愣住了。"},
      {t:"d", w:"林婉如", x:"你石印过？"},
      {t:"d", w:"沈怀瑾", x:"湖南，湘乡。去年。"},
      {t:"d", w:"林婉如", x:"五百张，都发出去了？"},
      {t:"n", x:"沈怀瑾沉默了一会儿。"},
      {t:"d", w:"沈怀瑾", x:"发出去三百多张。"},
      {t:"d", w:"沈怀瑾", x:"有人拿它包了东西。有人拿去糊了墙。"},
      {t:"d", w:"沈怀瑾", x:"有个老先生看了半天，问我：这是谁家的地图，怎么画得这么怪。"},
      {t:"n", x:"林婉如笑了。"},
      {t:"n", x:"然后她不笑了。"},
      {t:"d", w:"林婉如", x:"我去年在广州，看见过法国人的兵舰。"},
      {t:"d", w:"林婉如", x:"就停在白鹅潭。炮口对着城。"},
      {t:"d", w:"林婉如", x:"那天我在江边站了一个下午。"},
      {t:"d", w:"林婉如", x:"我想，如果有一万个人站在江边，会不会不一样。"},
      {t:"d", w:"沈怀瑾", x:"会。"},
      {t:"d", w:"沈怀瑾", x:"但是一万个人不会自己站到江边去。"},
      {t:"n", x:"——"},
      {t:"d", w:"林婉如", x:"你叫什么名字？"},
      {t:"d", w:"沈怀瑾", x:"沈怀瑾。"},
      {t:"d", w:"林婉如", x:"林婉如。"},
      {t:"n", x:"那一年，沈怀瑾二十五岁。林婉如二十一岁。"},
      {t:"n", x:"他们隔着一个柜台，握了手。"},
      {t:"n", x:"那只手很凉。"}
    ],
    next:"c5_6"
  },

  "c5_6":{
    ch:"第五章", chTitle:"狮", place:"上海 · 四马路 · 书铺后间", date:"光绪二十五年 秋",
    beats:[
      {t:"n", x:"他们在书铺的后间谈了一个下午。"},
      {t:"n", x:"后间很小，堆着没上架的书。窗户对着一条弄堂。"},
      {t:"n", x:"——"},
      {t:"d", w:"林婉如", x:"你在湖南做什么？"},
      {t:"d", w:"沈怀瑾", x:"教书。"},
      {t:"d", w:"林婉如", x:"教什么？"},
      {t:"d", w:"沈怀瑾", x:"地理。还有时务。"},
      {t:"d", w:"沈怀瑾", x:"时务课后来停了。"},
      {t:"d", w:"林婉如", x:"为什么停？"},
      {t:"d", w:"沈怀瑾", x:"因为去年九月，北京杀了六个人。"},
      {t:"n", x:"——"},
      {t:"d", w:"沈怀瑾", x:"我教了三年书，教出二十几个学生。"},
      {t:"d", w:"沈怀瑾", x:"上个月有一个来找我，问我能不能给他写一封荐信，去湖北织布局做账房。"},
      {t:"d", w:"沈怀瑾", x:"我写了。"},
      {t:"d", w:"沈怀瑾", x:"他拿着信走的时候，我想：我教他的那些，他大概一辈子也用不上。"},
      {t:"d", w:"林婉如", x:"那你为什么还教？"},
      {t:"d", w:"沈怀瑾", x:"因为不教，就更没有。"},
      {t:"n", x:"——"},
      {t:"d", w:"林婉如", x:"我在洋行做了七年。"},
      {t:"d", w:"林婉如", x:"我父亲做了三十年。他的信条是：不替洋人做事，替林家做事。"},
      {t:"d", w:"林婉如", x:"这七年我想明白一件事。"},
      {t:"d", w:"林婉如", x:"替林家做事，也就是替洋人做事。"},
      {t:"d", w:"林婉如", x:"因为林家的钱，是从洋人的生意里分出来的。"},
      {t:"d", w:"林婉如", x:"分多分少，都是分。"},
      {t:"n", x:"——"},
      {t:"d", w:"沈怀瑾", x:"那你打算怎么办？"},
      {t:"n", x:"林婉如从袖子里拿出一样东西，放在桌上。"},
      {t:"n", x:"是一锭纱。白的，很细。"},
      {t:"d", w:"林婉如", x:"这是通州大生纱厂今年四月纺出来的第一锭纱。"},
      {t:"d", w:"林婉如", x:"张季直先生给我的。"},
      {t:"d", w:"林婉如", x:"他说他要办的不只是一个厂，是厂，是垦牧，是学堂，是银行。"},
      {t:"d", w:"林婉如", x:"我问他这些要多少钱。他说要很多。"},
      {t:"d", w:"林婉如", x:"我说，那我来筹。"},
      {t:"d", w:"沈怀瑾", x:"你筹到了吗？"},
      {t:"d", w:"林婉如", x:"筹到了一点。但是我一个人不够。"},
      {t:"n", x:"——"},
      {t:"n", x:"窗外天黑了。弄堂里有人在收衣服。"},
      {t:"d", w:"林婉如", x:"沈先生，我听说湖南人认死理。"},
      {t:"d", w:"沈怀瑾", x:"是。"},
      {t:"d", w:"林婉如", x:"那你说——一个教书先生，和一个洋行买办的女儿，能不能一起做一件事？"},
      {t:"n", x:"沈怀瑾看着桌上那锭纱。"},
      {t:"n", x:"看了很久。"},
      {t:"n", x:"他没有立刻回答。"},
      {t:"n", x:"——"},
      {t:"n", x:"这一年，中国很大，也很空。"},
      {t:"n", x:"空在没有人。没有人肯把手伸出来，去够另一个人手里的东西。"}
    ],
    next:"c5_choice"
  },

/* ============================================================================
   引擎
   ============================================================================ */
(function(){
"use strict";

const $  = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag);
  if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; };

const SAVE_KEY = "shijutu_save_v1";

let S = {
  shen:0, lin:0, flags:{}, scene:SCRIPT.start, idx:0,
  unlocked:{}, endings:{}, log:[], chapter:""
};

let typing = false, typeTimer = null, pendingResolve = null, pendingNode = null, pendingText = null;

/* 快进：ffOn 为按钮开关（常驻），ffHold 为按住 Ctrl 的临时快进 */
let ffOn = false, ffHold = false, ffTimer = null;
const FF_DELAY = 25;                        // 快进时每一拍停留的毫秒数（约 40 拍/秒）
const ffActive = () => ffOn || ffHold;
function refreshFFBtn(){ const b = $("#btnFF"); if(b) b.classList.toggle("on", ffActive()); }
function clearFF(){ if(ffTimer){ clearTimeout(ffTimer); ffTimer = null; } }
function scheduleFF(){
  clearFF();
  if(!ffActive()) return;
  ffTimer = setTimeout(() => {
    ffTimer = null;
    if(!ffActive()) return;
    advance();                              // 遇选择/弹层时 advance 会自行退出，循环即止
  }, FF_DELAY);
}
function applyFF(){
  refreshFFBtn();
  if(ffActive()){ finishTyping(); scheduleFF(); }
  else { clearFF(); save(); }               // 停止快进时补一次存档
}
function setFFOn(v){ ffOn = !!v; applyFF(); }
function setFFHold(v){ v = !!v; if(ffHold === v) return; ffHold = v; applyFF(); }

/* --------------------------- 存档 ---------------------------
   SAVE_KEY 是自动存档，每次推进都写，「续前一局」用它，保证随时能接上。
   SLOT_KEY 是五个手动存档位，只在玩家点「存档」时写，可以各自读回。
   两者格式完全相同，存的是同一份 snapshot()。 */
const SLOT_KEY = n => "shijutu_slot_" + n;
const SLOTS = 5;

function snapshot(){
  const sc = SCRIPT.scenes[S.scene] || {};
  const last = S.log.length ? S.log[S.log.length - 1].x : "";
  return {
    shen:S.shen, lin:S.lin, flags:S.flags, scene:S.scene, idx:S.idx,
    unlocked:S.unlocked, endings:S.endings, log:S.log.slice(-120), chapter:S.chapter,
    // 存档列表要显示的东西。放在 meta 里，读档时会被丢掉，不污染 S。
    meta:{ ch:sc.ch || S.chapter || "", place:sc.place || "", date:sc.date || "",
           t:Date.now(), last:last }
  };
}
function readRaw(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function writeRaw(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }
  catch(e){ return false; }        // 配额满或隐私模式
}

function save(){ writeRaw(SAVE_KEY, snapshot()); }
function hasSave(){ return !!readRaw(SAVE_KEY); }

function slotRead(n){ return readRaw(SLOT_KEY(n)); }
function slotWrite(n){ return writeRaw(SLOT_KEY(n), snapshot()); }
function slotClear(n){ try{ localStorage.removeItem(SLOT_KEY(n)); }catch(e){} }
function slotCount(){ let c = 0; for(let i = 1; i <= SLOTS; i++) if(slotRead(i)) c++; return c; }

/* 从一份存档启动。meta 只是给存档列表看的，不进 S。 */
function startFrom(d){
  const copy = Object.assign({}, d);
  delete copy.meta;
  Object.assign(S, copy);
  if(!S.log) S.log = [];
  choicePending = false; clearFF();
  $("#titleScreen").classList.add("fade-out");
  setTimeout(()=>$("#titleScreen").classList.add("hidden"), 700);
  $("#game").classList.remove("hidden");
  setMeters();
  const sc = SCRIPT.scenes[S.scene];
  page().innerHTML = "";
  if(sc && sc.card) renderCard(sc.card);
  setTopbar();
  renderCurrent();
}
function doLoad(){                       // 标题页的「续前一局」：读自动存档
  const d = readRaw(SAVE_KEY);
  if(!d){ toast("没有找到存档"); return; }
  startFrom(d);
}
function loadSlot(n){
  const d = slotRead(n);
  if(!d){ toast("第 " + n + " 格是空的"); return; }
  closeOverlay();
  startFrom(d);
  toast("已读取存档 " + n);
}

/* --------------------------- 觉醒度 --------------------------- */
/* 进度条定标：全篇实际能拿到的最大点数，而不是想当然的 100。
   全部选择都取最高分时，沈怀瑾 21、林婉如 15（见 _check.js 的 maxOf 校验）。
   不定标的话条子最多只能填到 21%，等于没有反馈。 */
const CAP_SHEN = 21, CAP_LIN = 15;
function setMeters(anim){
  const ms = Math.max(0, Math.min(100, Math.round(S.shen / CAP_SHEN * 100)));
  const ml = Math.max(0, Math.min(100, Math.round(S.lin  / CAP_LIN  * 100)));
  $("#fillShen").style.width = ms + "%";
  $("#fillLin").style.width  = ml + "%";
  $("#numShen").textContent = S.shen;
  $("#numLin").textContent  = S.lin;
}
function gain(kind, n){
  if(kind === "shen"){ S.shen += n; }
  else if(kind === "lin"){ S.lin += n; }
  setMeters();
  toast((kind === "shen" ? "沈怀瑾" : "林婉如") + " 觉醒 +" + n);
}
function toast(msg){
  const box = $("#toast");
  const t = el("div","toast-item", msg);
  box.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 520); }, 2200);
}

/* --------------------------- 顶栏 --------------------------- */
function setTopbar(){
  const sc = SCRIPT.scenes[S.scene];
  if(!sc) return;
  S.chapter = sc.ch;
  $("#tbChapter").innerHTML = sc.ch + " · <b>" + sc.chTitle + "</b>";
  const bits = [];

  if(sc.date)  bits.push(sc.date);
  $("#tbMeta").textContent = bits.join("　｜　");

/* --------------------------- 打字机 --------------------------- */
function typeInto(node, text, speed){
  return new Promise(resolve => {
    // 快进时直接落字。落字后必须重新滚动一次：调用方的 scrollDown() 是在节点还空着的时候
    // 算的，文字随后一次性长出来，不补滚就会有一截落在可视区下面，看起来「显示不全」。
    if(!speed || ffActive()){ node.textContent = text; scrollDown(); resolve(); return; }
    typing = true;
    let i = 0;
    node.textContent = "";
    const done = () => {
      typing = false; typeTimer = null;
      pendingResolve = null; pendingNode = null; pendingText = null;
      node.textContent = text;
      scrollDown();                            // 补全后同样补滚一次
      resolve();
    };
    const step = () => {
      if(!typing){ done(); return; }
      i += Math.max(1, Math.round(text.length / 260));
      node.textContent = text.slice(0, i);
      scrollDown();                            // 逐字显示时跟着文字走，末行始终可见
      if(i >= text.length){ done(); return; }
      typeTimer = setTimeout(step, speed);
    };
    pendingResolve = resolve; pendingNode = node; pendingText = text;
    typeTimer = setTimeout(step, speed);
  });
}
// 立即结束打字：补全文字并兑现 promise（否则文字会停在半截、promise 永不 resolve）
function finishTyping(){
  if(!typing) return;
  typing = false;
  if(typeTimer){ clearTimeout(typeTimer); typeTimer = null; }
  if(pendingNode) pendingNode.textContent = pendingText;
  scrollDown();                     // 补全的文字同样会把末行顶出可视区，补滚一次
  const r = pendingResolve;
  pendingResolve = null; pendingNode = null; pendingText = null;
  if(r) r();
}

/* --------------------------- 渲染 --------------------------- */
const page = () => $("#page");

function scrollDown(){ const st = $("#stage"); st.scrollTop = st.scrollHeight; }

function renderCard(card){
  const d = el("div","chapter-card");
  d.appendChild(el("div","cc-num", card.num));
  d.appendChild(el("div","cc-title", card.title));
  d.appendChild(el("div","cc-sub", card.sub));
  page().appendChild(d);
}

function pushLog(who, text){
  S.log.push({ c:S.chapter, w:who, x:text });
  // 上限 2000 条。全篇约 1626 拍，快进一口气跑完也不会把前面的记录挤掉——
  // 快进之后「回想」是唯一能补读的地方，挤掉就等于那段文字没了。
  if(S.log.length > 2000) S.log.shift();
}

function beatNode(b){
  const wrap = el("div","beat");
  if(b.t === "n"){
    const p = el("div","line narration" + (b.emph ? " emph" : ""));
    wrap.appendChild(p);
    pushLog("", b.x);
    return { wrap, node:p, text:b.x, speed:12 };
  }
  if(b.t === "d"){
    const sp = el("div","speaker");
    sp.textContent = b.w;
    if(b.r) sp.appendChild(el("span","role", "· " + b.r));
    const p = el("div","line");
    wrap.appendChild(sp); wrap.appendChild(p);
    pushLog(b.w, b.x);
    return { wrap, node:p, text:b.x, speed:16 };
  }
  if(b.t === "q"){
    const q = el("div","quote");
    const tx = el("div","q-text"); tx.textContent = b.x;
    q.appendChild(tx);
    if(b.src) q.appendChild(el("div","q-src","—— " + b.src));
    wrap.appendChild(q);
    pushLog("【引文】", b.x);
    return { wrap, node:null, text:null, speed:0 };
  }
  if(b.t === "letter"){
    const L = el("div","letter");
    const h = el("div","letter-head");
    h.appendChild(el("div","letter-to", b.to || b.title || ""));
    h.appendChild(el("div","letter-date", b.date || ""));
    L.appendChild(h);
    L.appendChild(el("div","letter-body", b.body || ""));
    if(b.sig){
      const sg = el("div","letter-sig");
      sg.appendChild(document.createTextNode(b.sig));
      if(b.seal){ const s = el("span","seal"); s.textContent = b.seal; sg.appendChild(s); }
      L.appendChild(sg);
    }
    wrap.appendChild(L);
    pushLog("【书信】" + (b.title || ""), b.body || "");
    return { wrap, node:null, text:null, speed:0 };
  }
  return null;
}

/* 当前待处理的 choice 节点 */
let choicePending = false;

/* next 可以写成字符串，也可以写成 (S) => 场景名 —— 用于按旗标/觉醒度分流 */
function nextOf(sc){ return typeof sc.next === "function" ? sc.next(S) : sc.next; }

function renderCurrent(){
  const sc = SCRIPT.scenes[S.scene];
  if(!sc) return;
  setTopbar();

  // 跳过条件不满足的节拍（用于分支回响）
  while(S.idx < sc.beats.length && sc.beats[S.idx].cond && !sc.beats[S.idx].cond(S)) S.idx++;

  if(S.idx >= sc.beats.length){
    // 场景结束
    const nx = nextOf(sc);
    if(nx){ gotoScene(nx); }
    else { showEndOfDemo(); }
    return;
  }

  const b = sc.beats[S.idx];

  if(b.t === "choice"){
    choicePending = true;
    renderChoices(b);
    return;
  }
  if(b.t === "map"){
    const fresh = (b.reveal || []).filter(id => !S.unlocked[id]);
    (b.reveal || []).forEach(id => { S.unlocked[id] = true; });
    const w = el("div","beat");
    const q = el("div","quote");
    q.appendChild(el("div","q-text", "【时局图 · 展开】" + (b.text || "")));
    q.appendChild(el("div","q-src","—— 点击右上角「时局图」查看"));
    w.appendChild(q);
    page().appendChild(w);
    if(fresh.length) toast("时局图 · 新增标记");
    save();
    S.idx++; setTimeout(renderCurrent, ffActive() ? 60 : 520); return;
  }
  if(b.t === "tbc"){
    renderTBC(); return;
  }
  if(b.t === "end"){
    renderEnding(b.id); return;
  }

  const built = beatNode(b);
  if(!built){ S.idx++; renderCurrent(); return; }
  page().appendChild(built.wrap);
  scrollDown();

  if(built.node && built.speed){
    typeInto(built.node, built.text, built.speed).then(()=>{
      setHint(true);
      scheduleFF();
    });
    setHint(false);
  }else{
    setHint(true);
    scheduleFF();
  }
}

function setHint(on){
  const h = $("#tapHint");
  if(on && !choicePending && !isOverlayOpen()) h.classList.add("on");
  else h.classList.remove("on");
}

function renderChoices(b){
  const d = el("div","choices");
  d.appendChild(el("div","choice-prompt", b.prompt || "你的选择"));

  // opts 可以带 cond(S)。不满足的选项不隐藏，而是显示为锁住的灰条并给出条件——
  // 让玩家看得见「还有一条路没走通」，觉醒度才有意义。
  const open = b.opts.filter(o => !o.cond || o.cond(S));
  const shut = b.opts.filter(o =>  o.cond && !o.cond(S));

  open.forEach(o => {
    const btn = el("button","choice");
    btn.appendChild(el("span","mark", "▸"));
    btn.appendChild(document.createTextNode(o.x));
    if(o.hint) btn.appendChild(el("span","hint", o.hint));
    btn.addEventListener("click", ev => {
      ev.stopPropagation();
      choicePending = false;
      d.remove();
      if(o.gain){ for(const k in o.gain) gain(k, o.gain[k]); }
      if(o.flag) S.flags[o.flag] = true;
      pushLog("【选择】", o.x);
      S.scene = o.to; S.idx = 0; save();
      page().innerHTML = "";
      renderCurrent();
    });
    d.appendChild(btn);
  });

  shut.forEach(o => {
    const btn = el("button","choice locked");
    btn.disabled = true;
    btn.appendChild(el("span","mark","·"));
    btn.appendChild(document.createTextNode(o.x));
    const why = typeof o.lock === "function" ? o.lock(S) : (o.lock || "条件不足");
    btn.appendChild(el("span","hint", "未解锁 —— " + why));
    d.appendChild(btn);
  });

  page().appendChild(d);
  scrollDown();
  setHint(false);
}

/* --------------------------- 场景推进 --------------------------- */
function gotoScene(id){
  choicePending = false;          // 进入新场景时清掉选择态，避免存档/重开后卡死
  S.scene = id; S.idx = 0; save();
  page().innerHTML = "";
  const sc = SCRIPT.scenes[id];
  if(!sc){ showEndOfDemo(); return; }
  if(sc.card) renderCard(sc.card);
  renderCurrent();
  $("#stage").scrollTop = 0;
}

function advance(){
  clearFF();
  if(choicePending) return;
  if(isOverlayOpen()) return;
  if(typing){ finishTyping(); return; }
  S.idx++;
  saveFF();
  renderCurrent();
}
// 快进时降频写盘：否则每 25ms 一次 JSON 序列化会拖慢推进
let saveAt = 0;
function saveFF(){
  if(!ffActive()){ save(); return; }
  const now = Date.now();
  if(now - saveAt < 700) return;
  saveAt = now; save();
}

const CHINA_PATH = "M 315,13 L 390,59 L 364,114 L 326,135 L 309,146 L 285,145 L 300,152 L 320,159 L 302,168 L 312,211 L 297,261 L 264,293 L 240,313 L 228,302 L 186,302 L 165,279 L 114,248 L 54,198 L 30,140 L 102,54 L 180,45 Z";
const TAIWAN_PATH = "M 320,246 L 327,250 L 330,260 L 327,271 L 321,267 L 318,255 Z";

function buildMapSvg(){
  const n = MARKERS.filter(m => S.unlocked[m.id]).length;
  const dark = Math.min(0.62, n * 0.10);
  let svg = '<svg id="mapSvg" viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="n"/>'
       + '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>';
  svg += '<rect x="0" y="0" width="420" height="360" fill="#e8dcc0"/>';
  svg += '<path d="' + CHINA_PATH + '" fill="#d8c9a6" stroke="#6b5a38" stroke-width="1.6" stroke-linejoin="round" filter="url(#rough)"/>';
  svg += '<path d="' + TAIWAN_PATH + '" fill="#d8c9a6" stroke="#6b5a38" stroke-width="1.2" stroke-linejoin="round"/>';
  svg += '<circle cx="238" cy="320" r="5" fill="#d8c9a6" stroke="#6b5a38" stroke-width="1"/>';
  // 内部分区虚线（示意）
  svg += '<path d="M 120,120 Q 200,150 300,140" fill="none" stroke="#b8a77f" stroke-width=".8" stroke-dasharray="3 4"/>';
  svg += '<path d="M 160,70 Q 190,180 230,290" fill="none" stroke="#b8a77f" stroke-width=".8" stroke-dasharray="3 4"/>';
  svg += '<text x="196" y="196" font-size="26" fill="#9c8a63" text-anchor="middle" letter-spacing="8" font-family="serif" opacity="0.55">大清国</text>';
  // 夜色
  svg += '<path d="' + CHINA_PATH + '" fill="#1a1408" opacity="' + dark + '"/>';
  svg += '<path d="' + TAIWAN_PATH + '" fill="#1a1408" opacity="' + dark + '"/>';
  // 动物标记
  MARKERS.forEach(m => {
    if(!S.unlocked[m.id]) return;
    const g = m.glyph;
    svg += '<g class="mk" opacity="0.96">';
    svg += '<rect x="' + (m.cx-17) + '" y="' + (m.cy-17) + '" width="34" height="34" rx="2" '
         + 'fill="#f4ead4" stroke="' + m.color + '" stroke-width="2.4" transform="rotate(-3 ' + m.cx + ' ' + m.cy + ')"/>';
    svg += '<text x="' + m.cx + '" y="' + (m.cy+8) + '" font-size="21" fill="' + m.color + '" '
         + 'text-anchor="middle" font-family="serif" font-weight="bold">' + g + '</text>';
    svg += '<text x="' + (m.cx+22) + '" y="' + (m.cy-18) + '" font-size="9.5" fill="' + m.color
         + '" font-family="serif" opacity="0.9">' + m.name + '</text>';
    svg += '</g>';
  });
  svg += '</svg>';
  return svg;
}

function openMap(){
  const n = MARKERS.filter(m => S.unlocked[m.id]).length;
  let side = '<h4>列 强 势 力 范 围</h4><div class="map-legend">';
  MARKERS.forEach(m => {
    const on = !!S.unlocked[m.id];
    side += '<div class="legend-row' + (on ? ' on' : '') + '">'
         +  '<div class="legend-glyph" style="color:' + (on ? m.color : '#8a8070') + '">' + m.glyph + '</div>'
