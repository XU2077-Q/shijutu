    + '<div class="tbc-row"><div class="k">第三章</div><div class="v"><b style="font-weight:400">蛙</b> · 1898 · 《时局图》问世、法国租借广州湾</div></div>'
    + '<div class="tbc-row"><div class="k">第四章</div><div class="v"><b style="font-weight:400">太阳</b> · 1895—1898 · 台湾割让、台湾民主国、乙未抗日</div></div>'
    + '<div class="tbc-row"><div class="k">第五章</div><div class="v"><b style="font-weight:400">狮</b> · 1898—1899 · 戊戌变法及其失败</div></div>'
    + '<div class="tbc-row"><div class="k">结局</div><div class="v">醒狮 / 孤臣泪 / 沥血肥虎 / 永清 / 东渡 —— 共五个。</div></div>'
    + '</div>'
    + '<div class="choices" style="margin-top:26px">'
    + '<button class="choice" id="tbcEndings"><span class="mark">▸</span>查看结局图鉴</button>'
    + '<button class="choice" id="tbcMap"><span class="mark">▸</span>凝视当前的《时局图》</button>'
    + '<button class="choice" id="tbcTitle"><span class="mark">▸</span>返回标题</button>'
    + '</div>';
  const w = el("div","beat"); w.innerHTML = h;
  page().appendChild(w); scrollDown();
  $("#tbcEndings").addEventListener("click", e => { e.stopPropagation(); openEndings(); });
  $("#tbcMap").addEventListener("click", e => { e.stopPropagation(); openMap(); });
  $("#tbcTitle").addEventListener("click", e => { e.stopPropagation(); toTitle(); });
  setHint(false);
  save();
}

function showEndOfDemo(){ renderTBC(); }

/* --------------------------- 结局 --------------------------- */
function renderEnding(id){
  const e = ENDINGS.filter(x => x.id === id)[0];
  if(!e){ renderTBC(); return; }
  S.endings[id] = true;
  const h = '<div class="tbc ending-final">'
    + '<h3>结 局 · ' + e.name + '</h3>'
    + '<div class="tbc-sub">' + (e.tag || "") + '</div>'
    + '<div class="ending-body">' + e.body + '</div>'
    + '</div>'
    + '<div class="choices" style="margin-top:26px">'
    + '<button class="choice" id="endCodex"><span class="mark">▸</span>查看结局图鉴</button>'
    + '<button class="choice" id="endMap"><span class="mark">▸</span>凝视最后的《时局图》</button>'
    + '<button class="choice" id="endTitle"><span class="mark">▸</span>返回标题</button>'
    + '</div>';
  const w = el("div","beat"); w.innerHTML = h;
  page().appendChild(w); scrollDown();
  $("#endCodex").addEventListener("click", ev => { ev.stopPropagation(); openEndings(); });
  $("#endMap").addEventListener("click",   ev => { ev.stopPropagation(); openMap(); });
  $("#endTitle").addEventListener("click", ev => { ev.stopPropagation(); toTitle(); });
  setHint(false);
  save();
}

/* --------------------------- 弹层 --------------------------- */
function isOverlayOpen(){ return $("#overlays").children.length > 0; }
function openOverlay(title, html){
  const ov = el("div","overlay");
  const pn = el("div","panel");
  const hd = el("div","panel-head");
  hd.appendChild(el("div","panel-title", title));
  const cl = el("button","panel-close", "✕");
  cl.addEventListener("click", closeOverlay);
  hd.appendChild(cl);
  pn.appendChild(hd);
  const bd = el("div","panel-body"); bd.innerHTML = html;
  pn.appendChild(bd);
  ov.appendChild(pn);
  ov.addEventListener("click", e => { if(e.target === ov) closeOverlay(); });
  $("#overlays").appendChild(ov);
  setHint(false);
}
function closeOverlay(){ $("#overlays").innerHTML = ""; setHint(true); scheduleFF(); }

/* --------------------------- 菜单 --------------------------- */
function openMenu(){
  const h = '<div class="choices" style="margin-top:0">'
    + '<button class="choice" id="mSave"><span class="mark">▸</span>存档</button>'
    + '<button class="choice" id="mLoad"><span class="mark">▸</span>读档</button>'
    + '<button class="choice" id="mMap"><span class="mark">▸</span>时局图</button>'
    + '<button class="choice" id="mNotes"><span class="mark">▸</span>史实注</button>'
    + '<button class="choice" id="mTitle"><span class="mark">▸</span>返回标题</button>'
    + '</div>';
  openOverlay("菜 单", h);
  $("#mSave").addEventListener("click", ()=>{ closeOverlay(); openSaves("save"); });
  $("#mLoad").addEventListener("click", ()=>{ closeOverlay(); openSaves("load"); });
  $("#mMap").addEventListener("click", ()=>{ closeOverlay(); openMap(); });
  $("#mNotes").addEventListener("click", ()=>{ closeOverlay(); openNotes(); });
  $("#mTitle").addEventListener("click", ()=>{ closeOverlay(); toTitle(); });
}

/* --------------------------- 存档位 --------------------------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function fmtTime(t){
  if(!t) return "";
  const d = new Date(t), p = n => (n < 10 ? "0" : "") + n;
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* mode: "save" 写档 / "load" 读档。两边的槽位长相一样，只有点击行为和标题不同。 */
function openSaves(mode){
  const saving = mode === "save";
  let h = '<div class="slot-tip">'
    + (saving ? '点一个格子，把当前进度写进去。已有的存档会被覆盖。'
              : '点一个格子，从那里继续。读档不会影响自动存档，随时可以再回来。')
    + '</div><div class="slots">';
  for(let i = 1; i <= SLOTS; i++){
    const d = slotRead(i), m = (d && d.meta) || {};
    h += '<div class="slot' + (d ? "" : " empty") + '" data-slot="' + i + '">'
      +   '<div class="slot-n">' + i + '</div>'
      +   '<div class="slot-body">'
      +     (d
              ? '<div class="slot-head">' + esc(m.ch || "存档") + '　' + esc(m.place || "") + '</div>'
                + '<div class="slot-meta">' + esc(m.date || "") + '　｜　觉醒 ' + d.shen + ' / ' + d.lin
                + '　｜　' + fmtTime(m.t) + '</div>'
                + '<div class="slot-last">' + esc(String(m.last || "").slice(0, 36)) + '</div>'
              : '<div class="slot-head empty-head">空 存 档 位</div>')
      +   '</div>'
      +   (saving && d ? '<button class="slot-x" data-del="' + i + '" title="清除这一格">×</button>' : '')
      + '</div>';
  }
  h += '</div>';
  openOverlay(saving ? "存 档" : "读 档", h);

  $("#overlays").querySelectorAll(".slot").forEach(row => {
    row.addEventListener("click", () => {
      const n = +row.getAttribute("data-slot");
      if(saving){
        const old = slotRead(n);
        if(old && !window.confirm("第 " + n + " 格已有存档（" + ((old.meta && old.meta.ch) || "") + "）。要覆盖吗？")) return;
        if(slotWrite(n)){ toast("已存入第 " + n + " 格"); openSaves("save"); }
        else toast("写入失败：浏览器存储不可用");
      }else{
        loadSlot(n);
      }
    });
  });
  $("#overlays").querySelectorAll(".slot-x").forEach(b => {
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      const n = +b.getAttribute("data-del");
      if(window.confirm("清除第 " + n + " 格的存档？")){ slotClear(n); openSaves("save"); }
    });
  });
}

/* --------------------------- 流程控制 --------------------------- */
function newGame(){
  S = { shen:0, lin:0, flags:{}, scene:SCRIPT.start, idx:0,
        unlocked:{}, endings:{}, log:[], chapter:"" };
  $("#titleScreen").classList.add("fade-out");
  setTimeout(()=>$("#titleScreen").classList.add("hidden"), 700);
  $("#game").classList.remove("hidden");
  setMeters();
  gotoScene(SCRIPT.start);
}
function toTitle(){
  $("#overlays").innerHTML = "";
  $("#game").classList.add("hidden");
  const ts = $("#titleScreen");
  ts.classList.remove("hidden");
  requestAnimationFrame(()=> ts.classList.remove("fade-out"));
  $("#btnContinue").disabled = !hasSave();
}

/* --------------------------- 事件绑定 --------------------------- */
$("#btnNew").addEventListener("click", newGame);
$("#btnContinue").addEventListener("click", doLoad);
$("#btnSlots").addEventListener("click", () => openSaves("load"));
$("#btnEndings").addEventListener("click", openEndings);
$("#btnAbout").addEventListener("click", openAbout);

$("#btnFF").addEventListener("click", () => setFFOn(!ffOn));
$("#btnMap").addEventListener("click", openMap);
$("#btnNotes").addEventListener("click", openNotes);
$("#btnLog").addEventListener("click", openLog);
$("#btnMenu").addEventListener("click", openMenu);

$("#stage").addEventListener("click", e => {
  if(e.target.closest(".choice") || e.target.closest(".choices")) return;
  advance();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeOverlay(); return; }
  if($("#game").classList.contains("hidden")) return;

  // 快进：按住 Ctrl 临时快进；按 F 切换常驻开关
  if(e.key === "Control"){ setFFHold(true); return; }
  if(e.key === "f" || e.key === "F"){ e.preventDefault(); setFFOn(!ffOn); return; }
  if(e.ctrlKey) return;                       // 其余 Ctrl 组合键交给浏览器

  if(isOverlayOpen()) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); advance(); }
  if(e.key === "m" || e.key === "M") openMap();
  if(e.key === "l" || e.key === "L") openLog();
});
document.addEventListener("keyup", e => { if(e.key === "Control") setFFHold(false); });
window.addEventListener("blur", () => setFFHold(false));   // 失焦时松开 Ctrl，避免卡在快进

$("#btnContinue").disabled = !hasSave();

})();
</script>
